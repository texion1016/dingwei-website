<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>列印 DM｜鼎瑋不動產</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
<style id="pageSizeStyle">@page { size: A4 portrait; margin: 0; }</style>
<style>
:root{--red:#BE2418;--red-deep:#7e1710;--pink:#f6e1dc;--ink:#211816;--line:#a89e9a;--paper:#fff}
*{box-sizing:border-box} body{margin:0;background:#5d5754;color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif}
.ctrl{position:sticky;top:0;z-index:10;padding:10px 16px;background:#28211f;color:#fff;box-shadow:0 3px 12px #0004}.ctrl-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.ctrl strong{font-size:15px}.ctrl-group{display:flex;gap:4px;flex-wrap:wrap}.ctrl button,.ctrl a{border:1px solid #8a817e;border-radius:6px;padding:7px 11px;background:transparent;color:#fff;font:700 13px "Noto Sans TC",sans-serif;text-decoration:none;cursor:pointer}.ctrl button.on{background:#fff;color:#28211f;border-color:#fff}.ctrl .print{margin-left:auto;padding:8px 18px;background:var(--red);border-color:var(--red)}.ctrl .note{margin:9px 0 6px;color:#d8d0cd;font-size:12px}.photo-picker{display:flex;gap:7px;flex-wrap:wrap}.photo-picker button{position:relative;width:78px;height:58px;padding:0;overflow:hidden;border:2px solid transparent;border-radius:5px;opacity:.5}.photo-picker button.sel{opacity:1;border-color:#ffd45a}.photo-picker img{width:100%;height:100%;object-fit:cover;display:block}.photo-picker b{position:absolute;top:2px;left:2px;display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#ffd45a;color:#27201e;font-size:12px}
.sheet{--pad:8mm;display:flex;flex-direction:column;gap:2.4mm;margin:16px auto;background:var(--paper);padding:var(--pad);overflow:hidden}.sheet.a4{width:210mm;height:297mm}.sheet.a3{--pad:10mm;width:420mm;height:297mm;gap:3mm}.sheet [contenteditable]:hover{outline:1.5px dashed var(--red);outline-offset:1px;cursor:text}.sheet [contenteditable]:focus{outline:2px solid var(--red);outline-offset:1px}
.head{display:grid;grid-template-columns:34mm 1fr 24mm;gap:2.5mm;flex:none}.logo{display:grid;place-items:center;border:1px solid var(--line);padding:2mm}.logo img{max-width:100%;max-height:15mm}.brand-band,.deal{display:grid;place-items:center;color:#fff;background:var(--red);text-align:center}.brand-band{padding:1.5mm}.brand-band .co{font-family:"Noto Serif TC",serif;font-size:22px;font-weight:900;letter-spacing:.12em}.brand-band .url{font-size:11px;letter-spacing:.04em}.deal{font-family:"Noto Serif TC",serif;font-size:43px;font-weight:900}.case-name{flex:none;padding:1.3mm 5mm;border:1px solid var(--line);background:var(--pink);font-family:"Noto Serif TC",serif;font-size:27px;font-weight:900;letter-spacing:.28em;text-align:center}
.main{flex:1;min-height:0;display:grid;gap:2.5mm}.main .column{min-height:0;display:flex;flex-direction:column;gap:2mm}.spec{display:flex;flex-direction:column;gap:1.7mm}.spec-row{display:flex;gap:1.7mm}.cell{display:flex;flex:1;min-height:8mm;border:1px solid var(--line);align-items:stretch}.k{display:grid;place-items:center;min-width:16mm;padding:1mm 2mm;background:var(--pink);border-right:1px solid var(--line);font-weight:900;text-align:center}.v{flex:1;display:grid;place-items:center;padding:1mm 2mm;text-align:center;font-size:13px;font-weight:700}.v.size{font-family:"Noto Serif TC",serif;font-size:25px;color:#1544ad;font-weight:900}.v.price{padding:1.2mm}.price-big{font-family:"Noto Serif TC",serif;font-size:34px;line-height:1;color:var(--red);font-weight:900}.price-big small{font-size:17px}.price-unit{font-size:11px;color:#403a37}.pitch-title{flex:none;border:1px solid var(--line);background:var(--pink);font-weight:900;letter-spacing:.5em;text-align:center;padding:1mm}.pitch-edit{flex:1;min-height:0;border:1px solid var(--line);padding:2mm 3mm;overflow:hidden;white-space:pre-wrap;text-align:center;font-family:"Noto Serif TC",serif;font-size:18px;font-weight:900;line-height:1.75;letter-spacing:.1em}.photo{min-width:0;min-height:0;overflow:hidden;border:0;background:transparent}.photo img{display:block;width:100%;height:100%;object-fit:contain;background:transparent}.photo-grid{display:grid;gap:2.5mm;min-height:0}.photo-grid.two{grid-template-columns:repeat(2,1fr)}.photo-grid.three{grid-template-rows:repeat(3,1fr)}.photo-grid.four{grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(2,1fr)}.photo-grid.count-1{grid-template-columns:1fr;grid-template-rows:1fr}.photo-grid.three.count-2{grid-template-columns:repeat(2,1fr);grid-template-rows:1fr}.photo-grid.four.count-2{grid-template-columns:repeat(2,1fr);grid-template-rows:1fr}.photo-grid.four.count-3 .photo:first-child{grid-row:span 2}.contact{flex:none;display:grid;grid-template-columns:1fr 24mm 24mm;gap:2.5mm;align-items:center;padding:1.5mm 4mm;border:1px solid var(--line)}.contact .tel{font-family:"Noto Serif TC",serif;font-size:24px;font-weight:900}.contact .lic{font-size:10.5px;color:#403a37}.qr{text-align:center;font-size:10px;font-weight:700}.qr img,.qr canvas{display:block;width:20mm;height:20mm;margin:0 auto .5mm}.foot{flex:none;padding:1mm;background:var(--pink);border:1px solid var(--line);font-size:11px;font-weight:700;text-align:center}
/* A4：模板一至四分別固定 1、2、3、4 張照片 */
.a4-one{grid-template-rows:1.05fr .95fr}.a4-one.no-photos{grid-template-rows:1fr}.a4-one .bottom-info{display:grid;grid-template-columns:1fr 1fr;gap:2.5mm;min-height:0}.a4-two{grid-template-rows:1fr 70mm}.a4-two.no-photos{grid-template-rows:1fr}.a4-two .top-info{display:grid;grid-template-columns:1fr 1fr;gap:2.5mm;min-height:0}.a4-three{grid-template-columns:1fr 78mm}.a4-three.no-photos{grid-template-columns:1fr}.a4-four{grid-template-rows:1fr 1fr}.a4-four.no-photos{grid-template-rows:1fr}.a4-four .top-info{display:grid;grid-template-columns:1fr 1fr;gap:2.5mm;min-height:0}.a4 .column>.spec{flex:1;min-height:0}.a4 .column>.spec .spec-row{flex:1;min-height:0}.a4 .column>.spec .cell{min-height:0}.a4 .column>.spec .price-row{flex:1.3}.a4 .pitch-edit{flex:1}
/* A3：橫式張貼，左側圖片、右側資訊，底部統一聯絡資訊 */
.a3 .head{grid-template-columns:44mm 1fr 31mm}.a3 .logo img{max-height:19mm}.a3 .brand-band .co{font-size:28px}.a3 .deal{font-size:55px}.a3 .case-name{font-size:35px;padding:2mm}.a3 .main{gap:3mm}.a3 .spec{gap:2mm}.a3 .spec-row{gap:2mm}.a3 .cell{min-height:10.5mm}.a3 .v{font-size:16px}.a3 .v.size{font-size:31px}.a3 .price-big{font-size:43px}.a3 .pitch-edit{font-size:22px;line-height:1.8}.a3 .contact{grid-template-columns:1fr 29mm 29mm;padding:2mm 5mm}.a3 .contact .tel{font-size:31px}.a3 .contact .lic{font-size:13px}.a3 .qr img,.a3 .qr canvas{width:25mm;height:25mm}.a3 .foot{font-size:13px;padding:1.5mm}
.a3-one{grid-template-columns:1.7fr .9fr}.a3-one.no-photos{grid-template-columns:1fr}.a3-one .photo-stack{display:grid;grid-template-rows:1fr 42mm;gap:3mm;min-height:0}.a3-one .photo-stack.no-strip{grid-template-rows:1fr}.a3-one .small-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:2mm;min-height:0}.a3-one .small-strip.count-1{grid-template-columns:1fr}.a3-one .small-strip.count-2{grid-template-columns:repeat(2,1fr)}.a3-one .small-strip.count-3{grid-template-columns:repeat(3,1fr)}.a3-one .small-strip.count-4{grid-template-columns:repeat(4,1fr)}.a3-two{grid-template-columns:.8fr 1.2fr}.a3-two.no-photos{grid-template-columns:1fr}.a3-two .left-info{display:flex;flex-direction:column;gap:3mm;min-height:0}.a3-two .mosaic{display:grid;grid-template-columns:1.35fr 1fr;grid-template-rows:1fr 1fr;gap:3mm;min-height:0;flex:1}.a3-two .mosaic .photo:first-child{grid-row:1 / 3}.a3-two .mosaic.count-1{grid-template-columns:1fr;grid-template-rows:1fr}.a3-two .mosaic.count-1 .photo:first-child,.a3-two .mosaic.count-2 .photo:first-child{grid-row:auto}.a3-two .mosaic.count-2{grid-template-columns:repeat(2,1fr);grid-template-rows:1fr}.a3-two .strip{display:grid;grid-template-columns:repeat(3,1fr);gap:3mm;height:42mm;flex:none;min-height:0}.a3-two .strip.count-1{grid-template-columns:1fr}.a3-two .strip.count-2{grid-template-columns:repeat(2,1fr)}
@media print{body{background:#fff}.ctrl{display:none}.sheet{margin:0}.sheet [contenteditable]:hover,.sheet [contenteditable]:focus{outline:none}}
</style>
</head>
<body>
<div class="ctrl">
  <div class="ctrl-row"><strong>列印 DM</strong><span>紙張：</span><div class="ctrl-group" id="paperBtns"><button data-paper="a4" class="on">A4</button><button data-paper="a3">A3</button></div><div class="ctrl-group" id="tplBtns"></div><button class="print" onclick="window.print()">列印</button><a id="backLink" href="#">← 回物件頁</a></div>
  <p class="note" id="note">先選模板與照片，再直接點傳單上的文字修改。訴求重點可按 Enter 換行；切換模板或照片時會重置修改過的文字。</p>
  <div class="photo-picker" id="picker"></div>
</div>
<main class="sheet a4" id="sheet">載入中…</main>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<script src="assets/config.js?v=6"></script><script src="assets/data.js?v=6"></script>
<script>
(function(){'use strict';
  const C=window.COMPANY||{},SB=window.DW_SB||{url:'',key:''},sno=new URLSearchParams(location.search).get('sno');
  const TMPL={a4:[{id:'a4-one',cap:1,label:'模板1'},{id:'a4-two',cap:2,label:'模板2'},{id:'a4-three',cap:3,label:'模板3'},{id:'a4-four',cap:4,label:'模板4'}],a3:[{id:'a3-one',cap:6,label:'模板1'},{id:'a3-two',cap:6,label:'模板2'}]};
  let paper='a4',tpl='a4-one',L=null,selected=[];
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const purl=p=>/^https?:\/\//.test(p)?p:'assets/photos/'+p;
  const active=()=>TMPL[paper].find(x=>x.id===tpl);
  const map=r=>({sno:r.sno,deal:r.deal,name:r.name,district:r.district||'',kind:r.kind||'',price:Number(r.price)||0,size:Number(r.size)||0,unit:r.unit||'',parking:!!r.parking,address:r.address||'',layout:r.layout||'',floor:r.floor||'',age:r.age||'',pitch:r.pitch||[],spec:r.spec||{},photos:r.photos||[]});
  function local(){return (window.LISTINGS||[]).find(x=>String(x.sno)===String(sno))||null}
  function load(){if(!SB.url)return Promise.resolve(local());return fetch(SB.url+'/rest/v1/dw_listings?sno=eq.'+encodeURIComponent(sno)+'&select=*',{headers:{apikey:SB.key,Authorization:'Bearer '+SB.key}}).then(r=>r.ok?r.json():Promise.reject()).then(r=>r[0]?map(r[0]):local()).catch(local)}
  function syncSelected(){if(!L)return;selected=selected.filter(x=>L.photos.includes(x)).slice(0,active().cap);for(const p of L.photos){if(selected.length>=Math.min(active().cap,L.photos.length))break;if(!selected.includes(p))selected.push(p)}}
  function buttons(){document.getElementById('tplBtns').innerHTML=TMPL[paper].map(x=>'<button data-t="'+x.id+'" class="'+(x.id===tpl?'on':'')+'">'+x.label+'</button>').join('');document.getElementById('note').textContent=paper==='a3'?'A3 版可放 6 張圖片並呈現更多資訊；請在列印對話框確認紙張尺寸為 A3。傳單上的文字可直接修改，訴求重點按 Enter 可新增下一行。':'A4 模板一至四分別固定使用 1、2、3、4 張圖片；請在列印對話框確認紙張尺寸為 A4。傳單上的文字可直接修改，訴求重點按 Enter 可新增下一行。'}
  function picker(){const el=document.getElementById('picker');if(!L?.photos?.length){el.innerHTML='';return}el.innerHTML=L.photos.map(p=>{const n=selected.indexOf(p);return '<button type="button" data-p="'+esc(p)+'" class="'+(n>-1?'sel':'')+'"><img src="'+purl(p)+'" alt="">'+(n>-1?'<b>'+ (n+1)+'</b>':'')+'</button>'}).join('')}
  function photo(p){return p?'<div class="photo"><img src="'+purl(p)+'" alt=""></div>':''}
  function photos(cls, items){const list=items.filter(Boolean);return list.length?'<div class="'+cls+' count-'+list.length+'">'+list.map(photo).join('')+'</div>':''}
  function pitch(){const val=(L.pitch||[]).map(esc).join('<br>')||'請直接輸入物件訴求重點';return '<div class="pitch-title">訴 求 重 點</div><div class="pitch-edit" contenteditable="true">'+val+'</div>'}
  function spec(extra){const price=L.deal==='rent'?L.price+'<small> 萬/月</small>':L.price.toLocaleString('zh-TW')+'<small> 萬</small>';const r=(k,v,cls='')=>'<div class="cell"><span class="k">'+k+'</span><span class="v '+cls+'" contenteditable="true">'+(cls==='price'?v:esc(v||'—'))+'</span></div>';let rows='<div class="spec-row">'+r('編號',L.sno)+r('類別',L.kind)+'</div><div class="spec-row">'+r('位置',L.address||L.district)+r('建坪',L.size+' 坪','size')+'</div><div class="spec-row">'+r('格局',L.layout)+r('樓別',L.floor)+'</div><div class="spec-row">'+r('車位',L.parking?'有':'無')+r('屋齡',L.age)+'</div><div class="spec-row price-row">'+r(L.deal==='rent'?'租金':'售價','<span class="price-big">'+price+'</span><span class="price-unit">'+(L.unit?L.unit+'萬/坪':'')+'</span>','price')+'</div>';if(extra){Object.entries(L.spec||{}).slice(0,6).forEach(([k,v])=>rows+='<div class="spec-row">'+r(k,v)+'</div>')}return '<div class="spec">'+rows+'</div>'}
  function header(){return '<div class="head"><div class="logo"><img src="assets/brand/logo_old.gif" alt="DING WEI REAL ESTATE"></div><div class="brand-band"><div><div class="co" contenteditable="true">'+esc(C.name||'鼎瑋不動產經紀有限公司')+'</div><div class="url" contenteditable="true">'+esc(location.origin+location.pathname.replace(/print\.html$/,'') )+'</div></div></div><div class="deal" contenteditable="true">'+(L.deal==='rent'?'租':'售')+'</div></div><div class="case-name" contenteditable="true">'+esc(L.name)+'</div>'}
  function contact(){return '<div class="contact"><div><div class="tel" contenteditable="true">'+esc(C.printPhone||C.tel||'03-3121381')+'　'+esc(C.printName||'')+'</div><div class="lic" contenteditable="true">經紀人：'+esc(C.broker||'')+'　證號：'+esc(C.brokerLicense||'')+'</div></div><div class="qr"><canvas id="qrCase"></canvas><span contenteditable="true">掃碼看本案</span></div><div class="qr"><img src="assets/brand/line_qr.png" alt="LINE QR"><span contenteditable="true">LINE 諮詢</span></div></div><div class="foot" contenteditable="true">'+esc(C.name||'鼎瑋不動產經紀有限公司')+'　'+esc(C.address||'')+'</div>'}
  function layout(){const P=selected.filter(Boolean),has=P.length>0,main=photo(P[0]),two=photos('photo-grid two',P.slice(0,2)),three=photos('photo-grid three',P.slice(0,3)),four=photos('photo-grid four',P.slice(0,4));let inner='';if(tpl==='a4-one')inner='<div class="main a4-one'+(main?'':' no-photos')+'">'+main+'<div class="bottom-info"><div class="column">'+spec(false)+'</div><div class="column">'+pitch()+'</div></div></div>';if(tpl==='a4-two')inner='<div class="main a4-two'+(two?'':' no-photos')+'"><div class="top-info"><div class="column">'+spec(false)+'</div><div class="column">'+pitch()+'</div></div>'+two+'</div>';if(tpl==='a4-three')inner='<div class="main a4-three'+(three?'':' no-photos')+'"><div class="column">'+spec(false)+pitch()+'</div>'+three+'</div>';if(tpl==='a4-four')inner='<div class="main a4-four'+(four?'':' no-photos')+'"><div class="top-info"><div class="column">'+spec(false)+'</div><div class="column">'+pitch()+'</div></div>'+four+'</div>';if(tpl==='a3-one'){const strip=photos('small-strip',P.slice(1,6)),stack=has?'<div class="photo-stack'+(strip?'':' no-strip')+'">'+main+strip+'</div>':'';inner='<div class="main a3-one'+(has?'':' no-photos')+'">'+stack+'<div class="column">'+spec(true)+pitch()+'</div></div>'}if(tpl==='a3-two'){const mosaic=photos('mosaic',P.slice(0,3)),strip=photos('strip',P.slice(3,6));inner='<div class="main a3-two'+(has?'':' no-photos')+'"><div class="left-info">'+spec(true)+pitch()+'</div>'+(has?'<div class="column">'+mosaic+strip+'</div>':'')+'</div>'}return inner}
  function render(){if(!L){document.getElementById('sheet').textContent='找不到這筆物件';return}const s=document.getElementById('sheet');s.className='sheet '+paper;s.innerHTML=header()+layout()+contact();const url=new URL('listing.html?sno='+encodeURIComponent(L.sno),location.href).href;if(window.QRCode)QRCode.toCanvas(document.getElementById('qrCase'),url,{margin:1,width:180},()=>{})}
  document.getElementById('paperBtns').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;paper=b.dataset.paper;tpl=TMPL[paper][0].id;document.querySelectorAll('#paperBtns button').forEach(x=>x.classList.toggle('on',x===b));document.getElementById('pageSizeStyle').textContent='@page { size: '+(paper==='a3'?'A3 landscape':'A4 portrait')+'; margin:0; }';syncSelected();buttons();picker();render()});
  document.getElementById('tplBtns').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;tpl=b.dataset.t;syncSelected();buttons();picker();render()});
  document.getElementById('picker').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const p=b.dataset.p,n=selected.indexOf(p);if(n>-1)selected.splice(n,1);else{if(selected.length>=active().cap)selected.shift();selected.push(p)}picker();render()});
  document.getElementById('backLink').href='listing.html?sno='+encodeURIComponent(sno||'');
  load().then(x=>{L=x;if(!L)return render();const n=Math.min(Math.max(L.photos.length,1),4);tpl='a4-'+['','one','two','three','four'][n];syncSelected();buttons();picker();render()});
})();
</script>
</body>
</html>

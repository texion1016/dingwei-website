<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>列印 DM｜鼎瑋不動產</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
<style>
:root {
  --red: #C0271B;
  --red-deep: #8C1710;
  --pink: #F7E3DC;
  --ink: #1E1512;
  --line: #999;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #6B6560;
  font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  color: var(--ink);
}

/* ---------- 控制列（列印時隱藏） ---------- */
.ctrl {
  position: sticky;
  top: 0;
  z-index: 10;
  background: #2B2320;
  color: #fff;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 18px;
  flex-wrap: wrap;
}
.ctrl b { font-size: 15px; }
.ctrl .tpl { display: inline-flex; border: 1.5px solid #fff; border-radius: 999px; overflow: hidden; }
.ctrl .tpl button { border: 0; background: none; color: #fff; font: inherit; font-weight: 700; padding: 6px 16px; cursor: pointer; }
.ctrl .tpl button.on { background: #fff; color: #2B2320; }
.ctrl .go {
  margin-left: auto;
  background: var(--red);
  color: #fff;
  border: 0;
  border-radius: 999px;
  font: inherit;
  font-weight: 700;
  padding: 8px 24px;
  cursor: pointer;
}
.ctrl a { color: #ccc; font-size: 13.5px; }

/* ---------- 傳單本體 ---------- */
.sheet {
  width: 210mm;
  min-height: 295mm;
  margin: 16px auto;
  background: #fff;
  padding: 9mm;
  display: flex;
  flex-direction: column;
  gap: 3mm;
}

/* 頁首紅條 */
.head {
  display: grid;
  grid-template-columns: 34mm 1fr 24mm;
  gap: 3mm;
  align-items: stretch;
}
.head .logo-box {
  border: 1px solid var(--line);
  display: grid;
  place-items: center;
  padding: 2mm;
}
.head .logo-box img { max-width: 100%; max-height: 17mm; }
.head .band {
  background: var(--red);
  color: #fff;
  display: grid;
  place-items: center;
  text-align: center;
  padding: 2mm;
}
.head .band .co { font-family: "Noto Serif TC", serif; font-weight: 900; font-size: 24px; letter-spacing: .12em; }
.head .band .url { font-size: 12.5px; letter-spacing: .05em; }
.head .deal {
  background: var(--red);
  color: #fff;
  display: grid;
  place-items: center;
  font-family: "Noto Serif TC", serif;
  font-weight: 900;
  font-size: 46px;
}

.case-name {
  background: var(--pink);
  border: 1px solid var(--line);
  text-align: center;
  font-family: "Noto Serif TC", serif;
  font-weight: 900;
  font-size: 30px;
  letter-spacing: .3em;
  padding: 2mm 0;
}

/* 主區 */
.main { flex: 1; display: grid; gap: 4mm; }
.main.tplA { grid-template-columns: 1fr 88mm; }
.main.tplB { grid-template-columns: 1fr; }

/* 規格表 */
.spec { display: flex; flex-direction: column; gap: 2mm; }
.spec .row { display: flex; gap: 2mm; }
.spec .cell {
  flex: 1;
  border: 1px solid var(--line);
  display: flex;
  align-items: center;
  min-height: 9mm;
}
.spec .k {
  background: var(--pink);
  font-weight: 900;
  padding: 1mm 3mm;
  min-width: 17mm;
  text-align: center;
  align-self: stretch;
  display: grid;
  place-items: center;
  border-right: 1px solid var(--line);
  flex: none;
}
.spec .v { flex: 1; text-align: center; font-weight: 700; font-size: 15px; padding: 1mm 2mm; }
.spec .v.size { font-family: "Noto Serif TC", serif; font-weight: 900; font-size: 30px; color: #1440A0; }
.spec .v.price { padding: 2mm; }
.spec .v.price .big { font-family: "Noto Serif TC", serif; font-weight: 900; font-size: 40px; color: var(--red); line-height: 1.05; }
.spec .v.price .big small { font-size: 20px; }
.spec .v.price .unit { font-size: 13px; color: #333; }

.pitch-head {
  background: var(--pink);
  border: 1px solid var(--line);
  text-align: center;
  font-weight: 900;
  letter-spacing: .5em;
  padding: 1mm 0;
}
.pitch-box {
  border: 1px solid var(--line);
  flex: 1;
  display: grid;
  place-items: center;
  padding: 3mm;
}
.pitch-box ul { margin: 0; padding: 0; list-style: none; text-align: center; }
.pitch-box li {
  font-family: "Noto Serif TC", serif;
  font-weight: 900;
  font-size: 23px;
  letter-spacing: .18em;
  line-height: 1.9;
}

/* 照片 */
.photosA { display: flex; flex-direction: column; gap: 3mm; }
.photosA .ph { border: 1px solid var(--line); height: 62mm; }
.photosB { display: grid; grid-template-columns: 1fr 1fr; gap: 3mm; }
.photosB .ph { border: 1px solid var(--line); height: 62mm; }
.ph img { width: 100%; height: 100%; object-fit: cover; display: block; }

/* 聯絡與 QR */
.contact {
  display: grid;
  grid-template-columns: 1fr 26mm 26mm;
  gap: 3mm;
  align-items: center;
  border: 1px solid var(--line);
  padding: 2mm 4mm;
}
.contact .tel { font-family: "Noto Serif TC", serif; font-weight: 900; font-size: 27px; letter-spacing: .04em; }
.contact .lic { font-size: 12px; color: #333; margin-top: 1mm; }
.qr { text-align: center; font-size: 11px; font-weight: 700; }
.qr img, .qr canvas { width: 22mm; height: 22mm; display: block; margin: 0 auto 1mm; }

.foot {
  background: var(--pink);
  border: 1px solid var(--line);
  text-align: center;
  font-weight: 700;
  font-size: 13.5px;
  padding: 1.5mm 0;
}

/* ---------- 列印 ---------- */
@page { size: A4 portrait; margin: 0; }
@media print {
  body { background: #fff; }
  .ctrl { display: none; }
  .sheet { margin: 0; width: auto; min-height: auto; }
}
</style>
</head>
<body>

<div class="ctrl">
  <b>列印 DM</b>
  <div class="tpl">
    <button id="tplA" class="on" onclick="setTpl('A')">模板一（三圖側排）</button>
    <button id="tplB" onclick="setTpl('B')">模板二（四圖下排）</button>
  </div>
  <button class="go" onclick="window.print()">🖨 列印</button>
  <a href="#" id="backLink">← 回物件頁</a>
</div>

<div class="sheet" id="sheet">載入中…</div>

<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<script src="assets/config.js?v=5"></script>
<script src="assets/data.js?v=5"></script>
<script>
(function () {
  "use strict";
  var C = window.COMPANY;
  var SB = window.DW_SB || { url: "", key: "" };
  var TPL = "A";
  var L = null;

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }
  function photoUrl(p) { return /^https?:\/\//.test(p) ? p : "assets/photos/" + p; }

  var sno = new URLSearchParams(location.search).get("sno");
  document.getElementById("backLink").href = "listing.html?sno=" + encodeURIComponent(sno || "");

  function mapRow(r) {
    return { sno: r.sno, deal: r.deal, name: r.name, district: r.district || "", kind: r.kind || "",
      price: Number(r.price) || 0, size: Number(r.size) || 0, unit: r.unit || "", parking: !!r.parking,
      address: r.address || "", layout: r.layout || "", floor: r.floor || "", age: r.age || "",
      pitch: r.pitch || [], photos: r.photos || [] };
  }

  function findLocal() {
    var hit = null;
    (window.LISTINGS || []).forEach(function (x) { if (String(x.sno) === sno) hit = x; });
    return hit;
  }

  function load() {
    if (!SB.url) return Promise.resolve(findLocal());
    return fetch(SB.url + "/rest/v1/dw_listings?sno=eq." + encodeURIComponent(sno) + "&select=*", {
      headers: { apikey: SB.key, Authorization: "Bearer " + SB.key }
    }).then(function (r) { if (!r.ok) throw 0; return r.json(); })
      .then(function (rows) { return rows.length ? mapRow(rows[0]) : findLocal(); })
      .catch(function () { return findLocal(); });
  }

  window.setTpl = function (t) {
    TPL = t;
    document.getElementById("tplA").classList.toggle("on", t === "A");
    document.getElementById("tplB").classList.toggle("on", t === "B");
    render();
  };

  function specHTML(l, compact) {
    var cnt = l.photos.length ? String(l.photos[0]).replace(/b\d+\.\w+$/, "") : l.sno;
    var age = (l.age || "").split(" ")[0];
    var priceHtml = l.deal === "rent"
      ? '<div class="big">' + l.price + '<small> 萬/月</small></div>'
      : '<div class="big">' + l.price.toLocaleString("zh-TW") + '<small> 萬</small></div>' +
        (l.unit ? '<div class="unit">' + esc(l.unit) + '萬/坪</div>' : "");
    return (
      '<div class="row"><div class="cell"><span class="k">編號</span><span class="v">' + esc(cnt) + "</span></div>" +
      (compact ? '<div class="cell"><span class="k">類別</span><span class="v">' + esc(l.kind) + "</span></div>" : "") + "</div>" +
      (compact ? "" : '<div class="row"><div class="cell"><span class="k">類別</span><span class="v">' + esc(l.kind) + "</span></div></div>") +
      '<div class="row"><div class="cell"><span class="k">位置</span><span class="v">' + esc(l.address || (l.district + "區")) + "</span></div></div>" +
      '<div class="row"><div class="cell"><span class="k">建坪</span><span class="v size">' + l.size + " 坪</span></div></div>" +
      '<div class="row"><div class="cell"><span class="k">格局</span><span class="v">' + esc(l.layout || "—") + "</span></div>" +
      '<div class="cell"><span class="k">樓別</span><span class="v">' + esc(l.floor || "—") + "</span></div></div>" +
      '<div class="row"><div class="cell"><span class="k">車位</span><span class="v">' + (l.parking ? "有" : "無") + "</span></div>" +
      '<div class="cell"><span class="k">屋齡</span><span class="v">' + esc(age || "—") + "</span></div></div>" +
      '<div class="row"><div class="cell"><span class="k">' + (l.deal === "rent" ? "租金" : "售價") + '</span><span class="v price">' + priceHtml + "</span></div></div>"
    );
  }

  function pitchHTML(l) {
    if (!l.pitch.length) return "";
    return '<div class="pitch-head">訴 求 重 點</div><div class="pitch-box"><ul>' +
      l.pitch.map(function (p) { return "<li>" + esc(p) + "</li>"; }).join("") + "</ul></div>";
  }

  function photosHTML(l, n, cls) {
    var caption = C.tel + "　" + C.storeName;
    return '<div class="' + cls + '">' + l.photos.slice(0, n).map(function (p) {
      return '<div class="ph"><img src="' + photoUrl(p) + '" alt="' + esc(l.name) + '"></div>';
    }).join("") + "</div>";
  }

  function render() {
    var l = L;
    if (!l) { document.getElementById("sheet").textContent = "找不到這筆物件"; return; }
    var listingUrl = new URL("listing.html?sno=" + encodeURIComponent(l.sno), location.href).href;

    var mainHtml = TPL === "A"
      ? '<div class="main tplA"><div class="spec">' + specHTML(l, false) + pitchHTML(l) + "</div>" + photosHTML(l, 3, "photosA") + "</div>"
      : '<div class="main tplB"><div class="spec">' + specHTML(l, true) + pitchHTML(l) + "</div>" + photosHTML(l, 4, "photosB") + "</div>";

    document.getElementById("sheet").innerHTML =
      '<div class="head">' +
      '<div class="logo-box"><img src="assets/brand/logo_old.gif" alt="DING WEI REAL ESTATE"></div>' +
      '<div class="band"><div><div class="co">' + esc(C.name) + '</div><div class="url">' + listingSiteUrl() + "</div></div></div>" +
      '<div class="deal">' + (l.deal === "rent" ? "租" : "售") + "</div>" +
      "</div>" +
      '<div class="case-name">' + esc(l.name) + "</div>" +
      mainHtml +
      '<div class="contact">' +
      '<div><span class="tel">' + esc(C.printPhone || C.tel) + "　" + esc(C.printName || "") + "</span>" +
      '<div class="lic">經紀人：' + esc(C.broker) + "　證號：" + esc(C.brokerLicense) + "</div></div>" +
      '<div class="qr"><canvas id="qrCase"></canvas>掃碼看本案</div>' +
      '<div class="qr"><img src="assets/brand/line_qr.png" alt="LINE QR">LINE 諮詢</div>' +
      "</div>" +
      '<div class="foot">' + esc(C.name) + "　" + esc(C.address) + "　" + listingSiteUrl() + "</div>";

    if (window.QRCode) {
      QRCode.toCanvas(document.getElementById("qrCase"), listingUrl, { margin: 1, width: 168 }, function () {});
    }
  }

  function listingSiteUrl() {
    return location.origin.indexOf("github.io") >= 0 || location.origin.indexOf("http") === 0
      ? location.origin + location.pathname.replace(/print\.html$/, "")
      : "https://texion1016.github.io/dingwei-website/";
  }

  load().then(function (l) {
    L = l;
    if (l && l.photos.length >= 4) TPL = "B";
    document.getElementById("tplA").classList.toggle("on", TPL === "A");
    document.getElementById("tplB").classList.toggle("on", TPL === "B");
    render();
  });
})();
</script>
</body>
</html>

    <style>

        right: 12px;
        z-index: 5;
        display: flex;
        gap: 8px;
      }
      .tools button {
        border: 0;
        border-radius: 6px;

        color: #fff;
        padding: 9px 14px;
        font: 700 14px inherit;
        cursor: pointer;

      .sheet {
        width: 210mm;
        height: 297mm;
        padding: 12mm 13mm 10mm;
        background: #fff;
        margin: 0 auto 8mm;
        position: relative;
        page-break-after: always;
        overflow: hidden;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        border-bottom: 2px solid #9f1e16;

      }
      .brand img {
        width: 40mm;
        max-height: 15mm;
        object-fit: contain;
        object-position: left;
      }
      .brand .co {
        font: 900 16pt "Noto Serif TC";
        letter-spacing: 0.08em;
        color: #9f1e16;
      }
      .brand small {
        margin-left: auto;
        font-size: 8pt;
      }
      .title {
        text-align: center;
        font: 900 29pt "Noto Serif TC";
        letter-spacing: 0.12em;
        margin: 46mm 0 33mm;
      }
      .docno {
        text-align: center;
        font-size: 12pt;
        margin-top: -25mm;
        margin-bottom: 20mm;
      }
      .lines {
        border-top: 1px solid #222;
      }
      .line {
        display: grid;
        grid-template-columns: 32mm 1fr;
        border-bottom: 1px solid #222;
        min-height: 9mm;
        align-items: center;
      }
      .line b {

      .line span {

      .legal {

      .companybar {
        position: absolute;
        left: 13mm;
        right: 13mm;
        bottom: 11mm;

        display: grid;
        grid-template-columns: 1.3fr 2fr 1fr;
        font-size: 8.5pt;
      }
      .companybar span {
        padding: 2mm;
        border-right: 1px solid #222;
      }
      .companybar span:last-child {

        padding: 3mm;

      .phead small {
        font: 400 9pt "Noto Sans TC";

        margin-top: 5px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        border: 1px solid #222;
        border-bottom: 0;

      .cell {
        min-height: 9mm;
        border-right: 1px solid #222;
        border-bottom: 1px solid #222;
        padding: 2mm;
      }
      .cell:nth-child(2n) {
        border-right: 0;
      }
      .cell b {
        display: block;
        font-size: 8.5pt;
        color: #111;
      }
      /* 固定欄位與格線保持黑色；案件實際填入的內容以藍色呈現。 */
      .sheet .grid .cell,
      .sheet .line span,
      .sheet .table td:not(:first-child),
      .sheet .table td.note,
      .sheet .features,
      .sheet .maplink {
        color: #15579a;
      }
      .sheet .table td:first-child,
      .sheet .table th,
      .sheet .section,
      .sheet .phead,
      .sheet .brand,
      .sheet .cell b {
        color: #111;
      }
      .input-data { color: #15579a; }
      .input-data.important { color: #b12620; font-weight: 900; }
      .check {
        display: inline-block;
        width: 4mm;
        height: 4mm;
        border: 1px solid #222;
        vertical-align: -0.4mm;
        margin-right: 1.2mm;
      }
      .check.y {
        position: relative;
        background: #fff;
        box-shadow: none;
      }
      .check.y::after {
        content: "✓";
        position: absolute;
        left: 50%;
        top: 50%;
        color: #111;
        font:
          700 4.2mm/1 "Noto Sans TC",
          sans-serif;
        transform: translate(-50%, -55%);
      }
      .section {
        font-weight: 900;
        background: #eee;
        border: 1px solid #222;
        border-bottom: 0;
        padding: 2mm 3mm;
      }
      .table {
        width: 100%;
        border-collapse: collapse;
        font-size: 8.4pt;
      }
      .table td,
      .table th {
        border: 1px solid #222;

        background: #f5f5f5;
        text-align: center;

        white-space: pre-wrap;

      .signature td,
      .signature th {
        border: 1px solid #222;
        padding: 2mm;
      }
      .two {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4mm;
      }
      .photos {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4mm;
        margin-top: 3mm;
      }
      .photo {
        height: 44mm;
        border: 1px solid #222;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      .photo img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .photo em {
        color: #777;
      }
      .amenities {
        font-size: 7.2pt;
        border: 1px solid #222;
        padding: 2mm;
        margin-top: 3mm;
      }
      .summary {
        display: grid;

      .summary .left {
        border: 1px solid #452b72;
        padding: 2mm;

      .summary .right {
        display: grid;
        gap: 4mm;
      }
      .summary .right .photo {
        height: 50mm;
      }
      .purple {
        color: #452b72;
        font-weight: 900;
        border-bottom: 2px solid #452b72;
        padding: 1mm 0;
        margin-bottom: 2mm;
      }
      .features {
        font-size: 12pt;
        font-weight: 700;
        text-align: center;
        white-space: pre-wrap;
        padding: 4mm;
      }
      .map-wrap {
        position: relative;
        width: 100%;
        height: 207mm;
        border: 1px solid #222;
        background: #f5f5f5;
        overflow: hidden;
      }
      .map {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
      }
      .map-pin {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 8mm;
        height: 8mm;
        background: #b5232e;
        border: 1.2mm solid #fff;
        border-radius: 50% 50% 50% 0;
        box-shadow: 0 1px 3px #0008;
        transform: translate(-50%, -72%) rotate(-45deg);
      }
      .map-pin::after {
        content: "";
        position: absolute;
        inset: 2.2mm;
        border-radius: 50%;
        background: #fff;
      }
      .maplink {
        font-size: 8pt;
      }
      /* 兩張資訊量較高的紙本表，保留資料內容並各自收在一張 A4 內。 */
      .exterior-sheet .cell {
        min-height: 8mm;
        padding: 1.4mm;
      }
      .exterior-sheet .photos {
        gap: 2.5mm;
        margin-top: 2mm;
      }
      .exterior-sheet .photo {
        height: 38mm;
        border: 0;
        background: transparent;
      }
      .exterior-sheet .photo img {
        object-fit: cover;
      }
      .exterior-sheet .amenities {
        margin-top: 2mm;
        padding: 1.2mm;
        line-height: 1.26;
      }
      .map-sheet {
        padding-top: 10mm;
        padding-bottom: 7mm;
      }
      .map-sheet .map-wrap {
        height: 165mm;
      }
      .map-sheet .maplink {
        margin: 2mm 0 0;
      }
      .loading {
        padding: 30px;
        text-align: center;
      }
      @media print {
        body {
          background: #fff;
        }
        .tools {
          display: none;
        }
        .sheet {
          margin: 0;
          break-after: page;
        }
        .sheet:last-child {
          break-after: auto;
        }
      }
      /* 產權調查篇：依紙本樣張固定欄位與A4比例 */
      .rights-sheet {
        padding: 7mm 6mm 6mm;
        font-family: "PMingLiU", "MingLiU", "Noto Serif TC", serif;
        font-size: 8.5pt;
        line-height: 1.12;
        color: #111;
      }
      .rights-sheet table {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
      }
      .rights-sheet td,
      .rights-sheet th {
        border: 0.35mm solid #111;
        padding: 0.75mm 1mm;
        vertical-align: middle;
        overflow-wrap: anywhere;
        word-break: break-all;
      }
      .rights-sheet .rights-head {
        height: 17mm;
        display: grid;
        grid-template-columns: 40mm 1fr auto;
        align-items: center;
        border-bottom: 0.35mm solid #111;
      }
      .rights-sheet .rights-head img {
        width: 37mm;
        max-height: 14mm;
        object-fit: contain;
        object-position: left;
      }
      .rights-sheet .rights-head h1 {
        font-size: 18pt;
        letter-spacing: 0.18em;
        margin: 0;
        text-align: center;
      }
      .rights-sheet .rights-head .number {
        font-size: 10pt;
        font-weight: 700;
      }
      .rights-sheet .rights-unit {
        text-align: right;
        font-size: 9pt;
        padding: 1mm 0;
      }
      .rights-sheet .rights-section {
        font-size: 11pt;
        font-weight: 700;
        padding: 1.4mm 0 0.7mm;
      }
      .rights-sheet .right-label {
        font-weight: 700;
        text-align: center;
        background: #fafafa;
      }
      .rights-sheet .fill {
        min-height: 5.8mm;
        white-space: pre-wrap;
        color: #15579a;
      }
      .rights-sheet .tall {
        height: 8mm;
      }
      .rights-sheet .micro {
        font-size: 7.4pt;
      }
      .rights-sheet .check {
        width: 3.7mm;
        height: 3.7mm;
        margin: 0 0.8mm 0 0;
      }
      .rights-sheet .check.y {
        background: #fff;
        box-shadow: none;
      }
      .rights-sheet .blank-cell {
        height: 7mm;
      }
      .rights-sheet .rights-total {
        font-weight: 700;
        color: #15579a;
      }
      .rights-sheet .registry th {
        height: 7mm;
        text-align: center;
        font-weight: 700;
      }
      .rights-sheet .registry .side-note {
        font-size: 8pt;
        text-align: center;
        line-height: 1.45;
      }
      .rights-sheet .registry .data-cell {
        height: 5.2mm;
        padding: 0.45mm;
      }
      .rights-sheet .registry .data-cell span {
        display: block;
        border: 0.35mm solid #333;
        height: 4mm;
        line-height: 3.4mm;
        padding: 0 0.5mm;
        overflow: hidden;
        color: #15579a;
      }
      .rights-sheet .parking td {
        height: 8mm;
      }
      .rights-sheet .parking .parking-title {
        width: 28mm;
        text-align: center;
        font-weight: 700;
        line-height: 1.45;
      }
      .rights-sheet .parking .parking-option {
        display: inline-block;
        margin-right: 7mm;
        white-space: nowrap;
      }
      /* 售屋資料表：所有格線都由同一個表格系統繪製，避免列印時出現斷線或雙線。 */
      .sale-sheet { padding: 6mm 7mm 5mm; font: 8.8pt/1.24 "PMingLiU", "MingLiU", "Noto Serif TC", serif; color:#161616; }
      .sale-sheet, .sale-sheet * { box-sizing:border-box; }
      .sale-sheet .sale-header { display:grid; grid-template-columns:43mm 1fr 28mm; align-items:center; min-height:18mm; border:0.25mm solid #171717; }
      .sale-sheet .sale-header img { width:39mm; max-height:15mm; object-fit:contain; margin:1mm 2mm; }
      .sale-sheet .sale-header h1 { margin:0; text-align:center; font:900 19pt "Noto Serif TC", serif; letter-spacing:.16em; white-space:nowrap; }
      .sale-sheet .sale-header b { padding:0 2mm; font:900 12.5pt "Noto Serif TC", serif; white-space:nowrap; text-align:center; }
      .sale-sheet .sale-overview { display:grid; grid-template-columns:38% 34% 28%; min-height:36mm; border-left:0.25mm solid #171717; border-right:0.25mm solid #171717; border-bottom:0.25mm solid #171717; }
      .sale-sheet .sale-overview > div { min-width:0; }

      .sale-sheet .sale-overview .case { border-right:0.25mm solid #171717; font:900 20pt "Noto Serif TC", serif; overflow-wrap:anywhere; color:#15579a; }
      .sale-sheet .sale-overview .meta { display:grid; grid-template-rows:repeat(4, 1fr); border-right:0.25mm solid #171717; }
      .sale-sheet .sale-overview .meta > div { display:grid; grid-template-columns:16mm 1fr; min-height:9mm; }
      .sale-sheet .sale-overview .meta > div + div { border-top:0.25mm solid #171717; }
      .sale-sheet .sale-overview .meta b { display:flex; align-items:center; justify-content:center; background:#f5f5f5; border-right:0.25mm solid #171717; font-weight:900; }
      .sale-sheet .sale-overview .meta span { display:flex; align-items:center; padding:1mm 2mm; overflow-wrap:anywhere; color:#15579a; }
      .sale-sheet .sale-overview .price { font:900 29pt "Noto Serif TC", serif; white-space:nowrap; color:#b12620; }
      .sale-sheet .sale-address { display:grid; grid-template-columns:18mm 1fr; min-height:9mm; border-left:0.25mm solid #171717; border-right:0.25mm solid #171717; border-bottom:0.25mm solid #171717; }
      .sale-sheet .sale-address b { display:flex; align-items:center; justify-content:center; background:#f5f5f5; border-right:0.25mm solid #171717; }
      .sale-sheet .sale-address span { display:flex; align-items:center; padding:1mm 2mm; overflow-wrap:anywhere; color:#15579a; }
      .sale-sheet .sale-columns { display:grid; grid-template-columns:52.5% 47.5%; min-height:110mm; border-left:0.25mm solid #171717; border-right:0.25mm solid #171717; border-bottom:0.25mm solid #171717; }
      .sale-sheet .sale-block { min-width:0; display:flex; flex-direction:column; }
      .sale-sheet .sale-block + .sale-block { border-left:0.25mm solid #171717; }
      .sale-sheet .sale-section { min-width:0; }
      .sale-sheet .sale-section + .sale-section { border-top:0.25mm solid #171717; }
      .sale-sheet .sale-section h2 { margin:0; min-height:6.5mm; display:flex; align-items:center; justify-content:center; padding:0.7mm 1mm; font:900 10.5pt "Noto Serif TC", serif; letter-spacing:.18em; background:#f5f5f5; border-bottom:0.25mm solid #171717; }
      .sale-sheet .sale-table { width:100%; table-layout:fixed; border-collapse:collapse; }
      .sale-sheet .sale-table th, .sale-sheet .sale-table td { height:6.5mm; padding:0.55mm 1.2mm; vertical-align:middle; overflow-wrap:anywhere; }
      .sale-sheet .sale-table th { width:40%; text-align:center; font-weight:900; background:#f5f5f5; border-right:0.25mm solid #171717; }
      .sale-sheet .sale-table td { border-bottom:0.25mm solid #171717; color:#15579a; }
      .sale-sheet .input-data { color:#15579a; font-weight:900; font-size:1.1em; }
      .sale-sheet .input-data.important { color:#b12620; font-size:1em; }
      .sale-sheet .sale-overview .case .input-data,
      .sale-sheet .sale-overview .price .input-data,
      .sale-sheet .sale-feature .input-data { font-size:1em; }
      .sale-sheet .sale-table td .input-data { font-size:10.2pt; }
      .sale-sheet .sale-table tr:last-child th, .sale-sheet .sale-table tr:last-child td { border-bottom:0; }
      .sale-sheet .sale-table tr + tr th { border-top:0.25mm solid #171717; }
      .sale-sheet .sale-table + .sale-table { border-top:0.25mm solid #171717; }
      .sale-sheet .sale-table.sale-four th, .sale-sheet .sale-table.sale-four td { width:25%; text-align:center; }
      .sale-sheet .sale-table.sale-four th { border-right:0.25mm solid #171717; }
      .sale-sheet .sale-table.sale-four td { border-right:0.25mm solid #171717; }
      .sale-sheet .sale-table.sale-four tr > *:last-child { border-right:0; }
      .sale-sheet .sale-table.sale-four tr + tr td { border-top:0.25mm solid #171717; }
      .sale-sheet .sale-table.sale-pairs th { width:20%; }
      .sale-sheet .sale-table.sale-pairs td { width:30%; border-right:0.25mm solid #171717; }
      .sale-sheet .sale-table.sale-pairs tr > *:last-child { border-right:0; }
      .sale-sheet .sale-table.sale-range th { width:18%; }
      .sale-sheet .sale-table.sale-range td { width:32%; border-right:0.25mm solid #171717; }
      .sale-sheet .sale-table.sale-range tr > *:last-child { border-right:0; }
      .sale-sheet .sale-feature-section { flex:1; display:flex; flex-direction:column; }
      .sale-sheet .sale-feature { flex:1; min-height:35mm; white-space:pre-wrap; padding:2.4mm 3mm; font:900 12.5pt/1.55 "Noto Serif TC", serif; overflow-wrap:anywhere; color:#15579a; }
      .sale-sheet .sale-images { display:grid; grid-template-columns:1fr 1fr; min-height:53mm; border-left:0.25mm solid #171717; border-right:0.25mm solid #171717; border-bottom:0.25mm solid #171717; }
      .sale-sheet .sale-image { min-width:0; display:flex; flex-direction:column; }
      .sale-sheet .sale-image + .sale-image { border-left:0.25mm solid #171717; }
      .sale-sheet .sale-image b { min-height:7mm; display:flex; align-items:center; justify-content:center; background:#f5f5f5; border-bottom:0.25mm solid #171717; font-size:10pt; }
      .sale-sheet .sale-image img { width:100%; height:46mm; object-fit:contain; display:block; }
      .sale-sheet .sale-map-body { position:relative; height:46mm; }
      .sale-sheet .sale-map-body img { height:100%; }
      .sale-sheet .sale-map-pin { position:absolute; left:50%; top:50%; width:4.2mm; height:4.2mm; border-radius:50%; background:#b12620; border:0.8mm solid #fff; box-shadow:0 0 0 0.45mm rgba(177,38,32,.45); transform:translate(-50%,-50%); }
      .sale-sheet .sale-empty { display:grid; place-items:center; flex:1; min-height:46mm; color:#666; }
      .sale-sheet .sale-bottom { display:grid; grid-template-columns:1fr 1fr; min-height:15mm; border-left:0.25mm solid #171717; border-right:0.25mm solid #171717; border-bottom:0.25mm solid #171717; }
      .sale-sheet .sale-bottom > div { padding:1.4mm 2mm; white-space:pre-wrap; overflow-wrap:anywhere; color:#15579a; }
      .sale-sheet .sale-bottom > div + div { border-left:0.25mm solid #171717; }
      .sale-sheet .sale-sign { display:grid; grid-template-columns:24% 20% 56%; min-height:17mm; border-left:0.25mm solid #171717; border-right:0.25mm solid #171717; border-bottom:0.25mm solid #171717; }
      .sale-sheet .sale-sign > span { padding:1.2mm 1.7mm; overflow-wrap:anywhere; color:#15579a; font-size:8.7pt; line-height:1.42; }
      .sale-sheet .sale-sign span + span { border-left:0.25mm solid #171717; }
      .sale-sheet .sale-sign .sale-staff { display:grid; align-content:center; gap:0.35mm; padding-right:2.4mm; }
      .sale-sheet .sale-sign .sale-staff-row { display:grid; grid-template-columns:13mm 1fr; align-items:baseline; gap:0.5mm; white-space:nowrap; }
      .sale-sheet .sale-sign .sale-staff-row > b,
      .sale-sheet .sale-sign .sale-staff-row b { color:#111; font-weight:900; }
      .sale-sheet .sale-sign .sale-staff-row .input-data { font-size:8.6pt; }
      @media print {
        .rights-sheet {
          padding: 7mm 6mm 6mm;
        }
      }
    </style>

  <body>
    <div class="tools">
      <button onclick="window.print()">列印</button
      ><button onclick="window.close()">關閉</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
      const SB = window.DW_SB?.url
          ? supabase.createClient(location.origin + "/api/admin/supabase", "dw-admin-session", {
              auth: { persistSession: false, autoRefreshToken: false },
            })
          : null,
        Q = new URLSearchParams(location.search),
        SNO = Q.get("sno"),

      function saleSheet() {
        const c = company();
        const value = (key, tone = "") => `<span class="input-data ${tone}">${esc(v(key, ""))}</span>`;
        const box = (label, key) => `<tr><th>${label}</th><td>${value(key)}</td></tr>`;
        const rangeBox = (leftLabel, leftKey, rightLabel, rightKey) => `<tr><th>${leftLabel}</th><td>${value(leftKey)}</td><th>${rightLabel}</th><td>${value(rightKey)}</td></tr>`;
        const staff = (label, nameKey, licenseKey = "") =>
          `<div class="sale-staff-row"><b>${label}</b><span>${value(nameKey)}${licenseKey ? `　<b>證號</b>${value(licenseKey)}` : ""}</span></div>`;
        const radius = { "週邊半徑300公尺": 300, "週邊半徑500公尺": 500, "週邊半徑1公里": 1000 }[v("map_radius", "")] || 300;
        const generatedLocationMap = staticMapUrl(v("latitude", ""), v("longitude", ""), radius, "1050,760");
        const image = (key, label, source = D[key], showPin = false) =>
          `<div class="sale-image"><b>${label}</b>${source ? (showPin ? `<div class="sale-map-body"><img src="${esc(source)}" alt="${label}" referrerpolicy="no-referrer"><span class="sale-map-pin" aria-label="物件位置"></span></div>` : `<img src="${esc(source)}" alt="${label}" referrerpolicy="no-referrer">`) : '<div class="sale-empty">未上傳圖片</div>'}</div>`;
        return sheet(
          `<div class="sale-header"><img src="assets/brand/logo_old.gif" alt="DING WEI REAL ESTATE"><h1>${esc(c.name || "鼎瑋不動產")}</h1><b>售屋資料表</b></div>
          <div class="sale-overview"><div class="case">${value("case_name")}</div><div class="meta"><div><b>房屋編號</b><span>${value("doc_no")}</span></div><div><b>樓層</b><span>${value("sales_floor")}</span></div><div><b>格局</b><span>${value("layout_detail")}</span></div><div><b>車位</b><span>${value("parking_info")}</span></div></div><div class="price">${value("commission_total", "important")}萬</div></div>
          <div class="sale-address"><b>地址</b><span>${value("doorplate")}</span></div>
          <div class="sale-columns"><section class="sale-block"><div class="sale-section"><h2>權 利 範 圍</h2><table class="sale-table sale-range">${rangeBox("登記總面積", "registered_area", "土地面積", "land_area")}${rangeBox("建物合計", "house_area", "權利範圍", "land_right_range")}${rangeBox("車位坪數", "parking_area", "基地面積", "land_base_area")}</table><table class="sale-table sale-pairs"><tr><th>主建物</th><td>${value("main_area")}</td><th>附屬建物</th><td>${value("attached_area")}</td></tr><tr><th>公共設施</th><td>${value("common_area")}</td><th>公設比</th><td>${value("public_ratio")}</td></tr></table></div><div class="sale-section"><h2>建 物 狀 況</h2><table class="sale-table">${box("完成日期", "completion_date")}${box("主要建材", "main_material")}${box("隔間材料", "building_insulation")}${box("地板", "floor_material")}${box("座向", "direction")}</table></div><div class="sale-section"><h2>附 近 設施</h2><table class="sale-table">${box("學區", "school_zone")}${box("市場", "market")}${box("公園", "park")}${box("交通／站牌", "transportation")}</table></div></section><section class="sale-block"><div class="sale-section"><h2>付 款 條 件</h2><table class="sale-table sale-four"><tr><th>簽約款</th><th>備證</th><th>完稅</th><th>尾款</th></tr><tr><td>${value("payment_1_percent")}%</td><td>${value("payment_2_percent")}%</td><td>${value("payment_3_percent")}%</td><td>${value("payment_4_percent")}%</td></tr></table><table class="sale-table">${box("銀行設定（萬）", "loan_bank")}${box("實際貸款約（萬）", "loan_actual")}</table></div><div class="sale-section"><h2>使 用 狀 況</h2><table class="sale-table sale-pairs"><tr><th>自來水</th><td>${value("water")}</td><th>天然瓦斯</th><td>${value("gas")}</td></tr><tr><th>獨立電表</th><td>${value("electricity")}</td><th>管理費</th><td>${value("management_fee")}</td></tr></table><table class="sale-table"><tr><th>每坪／合計</th><td>${value("management_unit_fee")} 元／坪　　${value("management_total_fee")} 元</td></tr></table></div><div class="sale-section sale-feature-section"><h2>本 案 特 色</h2><div class="sale-feature">${value("summary_features")}</div></div></section></div>
          <div class="sale-images">${image("sale_location_map", "位置圖", generatedLocationMap || D.sale_location_map, Boolean(generatedLocationMap))}${image("sale_floor_plan", "平面圖")}</div>
          <div class="sale-bottom"><div><b>備註</b><br>${value("sale_remarks")}</div><div><b>附贈物／現況</b><br>${value("gift_summary")}</div></div>
          <div class="sale-sign"><span>驗屋：${value("inspection_status")}</span><span>買方確認：${value("buyer_confirm")}<br>賣方確認：${value("seller_confirm")}</span><span class="sale-staff">${staff("主管：", "store_manager")}${staff("經紀人：", "broker_name", "broker_license")}${staff("營業員：", "agent_name", "agent_license")}</span></div>`,
          "sale-sheet",
        );
      }
      function staticMapUrl(latitude, longitude, radiusMeters, imageSize = "760,1050") {
        const lat = Number(latitude), lng = Number(longitude);
        if (!Number.isFinite(lat) || !Number.isFinite(lng)) return "";
        const latDelta = radiusMeters / 111320;
        const lngDelta = radiusMeters / (111320 * Math.cos((lat * Math.PI) / 180));
        const bbox = [lng - lngDelta, lat - latDelta, lng + lngDelta, lat + latDelta]
          .map((n) => n.toFixed(6))
          .join(",");
        const query = new URLSearchParams({
          bbox,
          bboxSR: "4326",
          size: imageSize,
          imageSR: "4326",
          format: "png32",
          transparent: "false",
          f: "image",
        });
        return "https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/export?" + query;
      }
      function mapPage() {
        const lat = v("latitude", ""),
          lng = v("longitude", ""),
          radiusLabel = v("map_radius", "週邊半徑300公尺"),
          radius = { "週邊半徑300公尺": 300, "週邊半徑500公尺": 500, "週邊半徑1公里": 1000 }[radiusLabel] || 300,
          src = staticMapUrl(lat, lng, radius);
        return sheet(
          `${b()}<h1 class="phead">${esc(radiusLabel)}地圖　<small>日期：${esc(v("map_date", ""))}</small></h1><div class="grid">${field("名稱", "case_name")}${field("編號", "doc_no")}${field("地址", "doorplate")}${field("種類", "property_type")}${field("經緯度", "latitude")}${field("地圖範圍", "map_radius")}</div>${src ? `<div class="map-wrap"><img class="map" src="${src}" alt="物件週邊地圖" referrerpolicy="no-referrer"><span class="map-pin" aria-label="物件位置"></span></div>` : '<div class="map-wrap" style="display:grid;place-items:center">请先填写纬度与经度，才会显示位置地图。</div>'}<p class="maplink">地圖備註：${esc(v("map_note", ""))}　　Google 地圖：<span>${lat && lng ? `https://maps.google.com/?q=${esc(lat)},${esc(lng)}` : "—"}　　© Esri</span></p>`,
          "map-sheet",
        );
      }
      const pages = {
        cover,
        attachments,
        rights: exactRights,
        condition,
        exterior,
        terms,
        summary,
        map: mapPage,
        sale_sheet: saleSheet,
      };
      const PRINT_LABELS = {
        cover: "封面",
        attachments: "附件與簽收表",
        rights: "產權調查篇",
        condition: "物件現況調查篇",
        exterior: "建築外觀說明",
        terms: "重要交易條件",
        summary: "建物調查表",
        map: "週邊地圖",
        sale_sheet: "售屋資料表",
      };
      function printFileName(caseName) {
        const safeCase = String(caseName || "未命名案件")
          .replace(/[\\/:*?"<>|]/g, " ")
          .replace(/\s+/g, " ")
          .trim() || "未命名案件";
        return safeCase + "-" + (ONLY ? (PRINT_LABELS[ONLY] || "售租屋資料") : "售租屋資料");
      }
      async function boot() {
        try {
          if (!SB || !SNO) {
            document.getElementById("out").textContent =
              "缺少案件或资料库设定。";
            return;
          }
          const a = await SB.from("dw_listings")
              .select("*")
              .eq("sno", SNO)
              .maybeSingle(),
            d = await SB.from("dw_property_files")
              .select("*")
              .eq("listing_id", a.data?.id)
              .maybeSingle();
          if (a.error || !a.data || d.error || !d.data) {
            document.getElementById("out").textContent =
              "找不到已储存的说明书资料，请返回后台先填写并储存。";
            return;
          }
          L = a.data;
          D = d.data.data || {};
          // Chromium 會把頁面標題帶進「另存為 PDF」的建議檔名。
          document.title = printFileName(D.case_name || L.name);
          const order = ONLY ? [ONLY] : DW_DISCLOSURE_PAGE_ORDER;
          document.getElementById("out").innerHTML = order
            .filter((k) => pages[k])
            .map((k) => pages[k]())
            .join("");
        } catch (error) {
          console.error(error);
          document.getElementById("out").innerHTML =
            '<div class="loading">列印资料载入失败：' +
            esc(error.message) +
            "。请返回说明书页面重新储存后再试。</div>";
        }
      }
      boot();
    </script>

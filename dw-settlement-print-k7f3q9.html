<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<script>if(location.protocol==='file:')location.replace('https://dingwei-realty.com/'+location.pathname.split('/').pop()+location.search);</script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>代租代管結算列印</title>
<style>
@page{size:A4 landscape;margin:10mm}*{box-sizing:border-box}body{margin:0;background:#edf0f1;color:#131313;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif}.tool{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;background:#302525;color:#fff}.tool button{border:0;border-radius:5px;background:#a52f25;color:#fff;padding:8px 17px;font:700 14px inherit;cursor:pointer}.paper{width:277mm;min-height:190mm;margin:16px auto;padding:10mm;background:#fff;box-shadow:0 2px 16px #0002}.brand{display:flex;justify-content:space-between;align-items:end;padding-bottom:10px;border-bottom:3px solid #92281f}.brand h1{margin:0;font-size:25px;letter-spacing:.14em}.brand p{margin:0;color:#7e2a23;font-weight:700}.meta{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:0;margin:12px 0;border:1px solid #272727}.meta div{min-height:54px;padding:8px 12px;border-right:1px solid #272727}.meta div:last-child{border-right:0}.meta span{display:block;font-size:12px}.meta b{display:block;margin-top:3px;color:#154a78;font-size:17px}.meta .money b{color:#a4241c;font-size:21px}.rate{margin:0 0 10px;font-size:12px;color:#6a504e}.rate b{color:#154a78}table{width:100%;border-collapse:collapse;font-size:12px}th,td{border:1px solid #272727;padding:7px 6px;text-align:center}th{background:#eee4df;font-weight:700}td.input{color:#154a78;font-weight:700}td.electric{color:#195e80;font-weight:700}td.subtotal{color:#a4241c;font-weight:700}td.total{color:#167148;font-weight:900}.summary{display:grid;grid-template-columns:repeat(5,1fr);margin-top:10px;border:1px solid #272727}.summary div{padding:8px 10px;border-right:1px solid #272727}.summary div:last-child{border:0;background:#f8e8dc}.summary span{font-size:11px}.summary b{display:block;font-size:17px;color:#154a78}.summary div:last-child b{color:#a4241c;font-size:21px}.note{min-height:40px;margin-top:10px;border:1px solid #272727;padding:8px 10px;font-size:12px}.foot{margin-top:10px;font-size:10px;color:#645452}@media print{body{background:#fff}.tool{display:none}.paper{width:auto;min-height:0;margin:0;padding:0;box-shadow:none}}
</style>
</head>
<body><div class="tool"><span>代租代管屋主結算</span><div><button onclick="window.print()">列印</button><button onclick="window.close()">關閉</button></div></div><main class="paper" id="app">正在讀取列印資料…</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/config.js?v=6"></script>
<script>
const cfg=window.DW_SB||{};const sb=supabase.createClient(location.origin+'/api/admin/supabase','dw-admin-session',{auth:{persistSession:false,autoRefreshToken:false}});const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const n=v=>Number.isFinite(Number(v))?Number(v):0;const money=v=>Math.round(n(v)).toLocaleString('zh-TW');const calc=(u,rate)=>{const electricity=Math.round(n(u.electricity_kwh)*n(rate));const subtotal=Math.round(n(u.rent_amount)+electricity);return{electricity,subtotal,total:Math.round(subtotal-n(u.management_fee))}};
(async()=>{const id=new URLSearchParams(location.search).get('statement');if(!id){document.getElementById('app').textContent='找不到結算單編號。';return}const st=await sb.from('dw_management_statements').select('*').eq('id',id).maybeSingle();if(st.error||!st.data){document.getElementById('app').textContent='讀取失敗：'+(st.error?.message||'找不到資料');return}const [project,owner,units]=await Promise.all([sb.from('dw_management_projects').select('*').eq('id',st.data.project_id).maybeSingle(),sb.from('dw_management_owners').select('*').eq('id',st.data.owner_id).maybeSingle(),sb.from('dw_management_statement_units').select('*').eq('statement_id',id).order('sort_order')]);if(project.error||owner.error||units.error){document.getElementById('app').textContent='讀取列印資料失敗。';return}const rows=units.data||[];const sum=rows.reduce((a,u)=>{const c=calc(u,st.data.electricity_rate);a.kwh+=n(u.electricity_kwh);a.rent+=n(u.rent_amount);a.electricity+=c.electricity;a.subtotal+=c.subtotal;a.fee+=n(u.management_fee);a.total+=c.total;return a},{kwh:0,rent:0,electricity:0,subtotal:0,fee:0,total:0});document.title=`${project.data.name}-${owner.data.owner_name}-${st.data.billing_roc_year}年${st.data.billing_month}月代租代管結算`;document.getElementById('app').innerHTML=`<header class="brand"><div><h1>鼎瑋不動產經紀有限公司</h1><p>代租代管屋主結算表</p></div><p>${st.data.billing_roc_year} 年 ${st.data.billing_month} 月</p></header><section class="meta"><div><span>案場</span><b>${esc(project.data.name)}</b></div><div><span>屋主</span><b>${esc(owner.data.owner_name)}${owner.data.owner_code?'（'+esc(owner.data.owner_code)+'）':''}</b></div><div class="money"><span>本期應付屋主</span><b>${money(sum.total)} 元</b></div></section><p class="rate">本期每度電費：<b>${n(st.data.electricity_rate)} 元</b>　｜　電費按用電度數 × 本期每度電費計算</p><table><thead><tr><th>起租日</th><th>編號／房號</th><th>用電度數</th><th>租金</th><th>電費</th><th>合計</th><th>代管費</th><th>總計</th><th>備註</th></tr></thead><tbody>${rows.map(u=>{const c=calc(u,st.data.electricity_rate);return`<tr><td class="input">${esc(u.lease_roc_year||'')}/${esc(u.lease_month||'')}/${esc(u.lease_day||'')}</td><td class="input">${esc(u.unit_no)}</td><td class="input">${n(u.electricity_kwh)}</td><td class="input">${money(u.rent_amount)}</td><td class="electric">${money(c.electricity)}</td><td class="subtotal">${money(c.subtotal)}</td><td class="input">${money(u.management_fee)}</td><td class="total">${money(c.total)}</td><td class="input">${esc(u.note)}</td></tr>`}).join('')}</tbody></table><section class="summary"><div><span>房戶數／用電度數</span><b>${rows.length} 間／${sum.kwh} 度</b></div><div><span>租金合計</span><b>${money(sum.rent)} 元</b></div><div><span>電費合計</span><b>${money(sum.electricity)} 元</b></div><div><span>代管費合計</span><b>${money(sum.fee)} 元</b></div><div><span>本期應付屋主</span><b>${money(sum.total)} 元</b></div></section><section class="note"><b>備註：</b>${esc(st.data.note||'—')}</section><p class="foot">本表為代租代管內部結算資料；租屋電費計收應以實際電費帳單及租賃契約約定為準。</p>`;setTimeout(()=>window.print(),300)})();
</script></body></html>

<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <script>
      // 后台资料受 .com 的登入 Cookie 保护；从本机档案直接开启无法取得权限。
      if (location.protocol === "file:") {
        location.replace("https://dingwei-realty.com/" + location.pathname.split("/").pop() + location.search);
      }
    </script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>售租屋資料｜鼎瑋後台</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@700;900&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --paper: #f3ede5;
        --white: #fff;
        --ink: #271c20;
        --muted: #75646a;
        --red: #b7251b;
        --deep: #86170f;
        --pink: #fbecea;
        --line: #e6dcd8;
        --gold: #a47a3d;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font:
          15px/1.6 "Noto Sans TC",
          "Microsoft JhengHei",
          sans-serif;
      }
      .top {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        gap: 13px;
        align-items: center;
        padding: 12px 22px;
        background: var(--red);
        color: white;
      }
      .seal {
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        border-radius: 7px;
        background: #fff;
        color: var(--red);
        font: 900 17px "Noto Serif TC";
      }
      .top h1 {
        margin: 0;
        font: 900 19px "Noto Serif TC";
      }
      .top .hint {
        font-size: 12px;
        opacity: 0.75;
      }
      .top a {
        margin-left: auto;
        color: white;
        text-decoration: none;
      }
      .shell {
        max-width: 1280px;
        margin: 0 auto;
        padding: 22px;
      }
      .notice {
        padding: 12px 15px;
        border: 1px solid #e7cda9;
        background: #fff6e8;
        color: #775220;
        border-radius: 10px;
        margin-bottom: 16px;
      }
      .layout {
        display: grid;
        grid-template-columns: 230px minmax(0, 1fr);
        gap: 18px;
      }
      .side,
      .main {
        background: var(--white);
        border: 1px solid var(--line);
        border-radius: 12px;
      }
      .side {
        height: max-content;
        position: sticky;
        top: 72px;
        padding: 14px;
      }
      .case {
        padding: 7px 8px 14px;
        border-bottom: 1px solid var(--line);
        margin-bottom: 8px;
      }
      .case b {
        display: block;
        font-family: "Noto Serif TC";
      }
      .case small {
        color: var(--muted);
      }
      .side button {
        display: block;
        width: 100%;
        border: 0;
        background: none;
        text-align: left;
        border-radius: 7px;
        padding: 8px 10px;
        color: var(--ink);
        font: inherit;
        cursor: pointer;
      }
      .side button.on,
      .side button:hover {
        background: var(--pink);
        color: var(--red);
        font-weight: 700;
      }
      .main {
        padding: 24px;
        min-width: 0;
      }
      .head {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        justify-content: space-between;
        padding-bottom: 16px;
        border-bottom: 1px solid var(--line);
      }
      .head h2 {
        margin: 0;
        font: 900 23px "Noto Serif TC";
      }
      .head p {
        margin: 2px 0 0;
        color: var(--muted);
        font-size: 13px;
      }
      .actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }
      .btn {
        border: 1.5px solid var(--red);
        border-radius: 8px;
        padding: 8px 13px;
        color: var(--red);
        background: #fff;
        font: 700 14px inherit;
        cursor: pointer;
        text-decoration: none;
      }
      .btn:hover {
        background: var(--pink);
      }
      .btn.primary {
        background: var(--red);
        color: #fff;
      }
      .btn.primary:hover {
        background: var(--deep);
      }
      .group {
        margin-top: 22px;
        border: 1px solid var(--line);
        border-radius: 10px;
        overflow: hidden;
      }
      .group h3 {
        margin: 0;
        padding: 9px 14px;
        background: #f8f5f2;
        font-size: 15px;
      }
      .fields {
        padding: 14px;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px 14px;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .field.wide {
        grid-column: 1/-1;
      }
      .field label {
        font-weight: 700;
        font-size: 13px;
        color: var(--muted);
      }
      .field input,
      .field select,
      .field textarea {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 7px;
        padding: 8px 10px;
        background: #fff;
        color: var(--ink);
        font: inherit;
      }
      .field textarea {
        min-height: 84px;
        resize: vertical;
      }
      .check {
        flex-direction: row;
        align-items: center;
        gap: 8px;
      }
      .check label {
        color: var(--ink);
        font-size: 14px;
      }
      .check input {
        width: 17px;
        height: 17px;
        accent-color: var(--red);
      }
      .photo-choice {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
        gap: 10px;
      }
      .photo-choice label {
        position: relative;
        border: 1px solid var(--line);
        border-radius: 7px;
        overflow: hidden;
        cursor: pointer;
      }
      .photo-choice img {
        width: 100%;
        height: 94px;
        display: block;
        object-fit: contain;
        background: #f7f4f1;
      }
      .photo-choice span {
        display: block;
        padding: 4px 6px;
        font-size: 11px;
      }
      .photo-choice input {
        position: absolute;
        top: 6px;
        right: 6px;
        width: 18px;
        height: 18px;
        accent-color: var(--red);
      }
      .photo-slot {
        padding: 10px 0;
        border-bottom: 1px dashed var(--line);
      }
      .photo-slot:last-child {
        border: 0;
      }
      .photo-slot b {
        font-size: 13px;
      }
      .photo-slot select {
        margin-top: 6px;
      }
      .savebar {
        position: sticky;
        bottom: 12px;
        margin-top: 24px;
        padding: 12px;
        background: rgba(255, 255, 255, 0.95);
        border: 1px solid var(--line);
        border-radius: 10px;
        display: flex;
        align-items: center;
        gap: 10px;
        box-shadow: 0 5px 18px #40231b18;
      }
      .savebar span {
        margin-right: auto;
        color: var(--muted);
        font-size: 13px;
      }
      @media (max-width: 820px) {
        .layout {
          grid-template-columns: 1fr;
        }
        .side {
          position: static;
          display: flex;
          gap: 5px;
          overflow: auto;
          white-space: nowrap;
        }
        .case {
          display: none;
        }
        .side button {
          width: auto;
        }
        .main {
          padding: 17px;
        }
        .fields {
          grid-template-columns: 1fr;
        }
        .top .hint {
          display: none;
        }
        .head {
          display: block;
        }
        .actions {
          justify-content: flex-start;
          margin-top: 12px;
        }
      }
    </style>
    <style>
      .photo-choice > div {
        border: 1px solid var(--line);
        border-radius: 7px;
        overflow: hidden;
      }
      .print-label {
        width: 100%;
        font-size: 12px;
        font-weight: 700;
        color: var(--muted);
        text-align: right;
      }
      @media (max-width: 820px) {
        .print-label {
          text-align: left;
        }
      }
    </style>
  </head>
  <body>
    <header class="top">
      <span class="seal">鼎</span>
      <h1>售租屋資料／不動產說明書</h1>
      <span class="hint">資料會與案件一對一保存</span
      ><a href="dw-console-k7f3q9.html">← 返回物件管理</a>
    </header>
    <main class="shell">
      <div id="loading" class="notice">正在讀取案件資料…</div>
      <div id="app" style="display: none">
        <div class="layout">
          <nav class="side" id="nav">
            <div class="case">
              <b id="caseName">—</b><small id="caseMeta">—</small>
            </div>
          </nav>
          <section class="main">
            <div class="head">
              <div>
                <h2 id="sectionTitle">—</h2>
                <p>填写后按「儲存資料」，每张表可分别列印，也可整套输出。</p>
              </div>
              <div class="actions" id="printActions"></div>
            </div>
            <form id="editor"></form>
            <div class="savebar">
              <span id="saveStatus">尚未儲存</span
              ><button type="button" class="btn" id="allPrint">
                列印整套 8 頁</button
              ><button type="button" class="btn primary" id="saveBtn">
                儲存資料
              </button>
            </div>
          </section>
        </div>
      </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/config.js"></script>
    <script src="assets/data.js"></script>
    <script src="assets/disclosure-schema.js"></script>
    <script>
      const SB = window.DW_SB?.url
        ? supabase.createClient(location.origin + "/api/admin/supabase", "dw-admin-session", {
            auth: { persistSession: false, autoRefreshToken: false },
          })
        : null;
      const Q = new URLSearchParams(location.search);
      const SNO = Q.get("sno");
      let listing = null,
        file = null,
        doc = {},
        section = "base";
      const esc = (s) =>
        String(s ?? "").replace(
          /[&<>\"]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
        );
      const spec = (key, fallback = "") => listing?.spec?.[key] ?? fallback;
      const today = () => new Date().toISOString().slice(0, 10);
      const photoUrl = (p) =>
        /^https?:\/\//.test(p || "") ? p : "assets/photos/" + p;
      function defaults() {
        const c = window.COMPANY || {};
        return {
          doc_no: (listing?.sno || "") + "/" + (listing?.name || ""),
          prepared_date: today(),
          case_name: listing?.name || "",
          deal: listing?.deal === "rent" ? "租賃" : "買賣",
          doorplate: listing?.address || "",
          office_checked: "桃園市蘆竹地政事務所",
          company_name: c.name || "鼎瑋不動產經紀有限公司",
          company_address: c.address || "",
          company_tel: c.tel || "",
          property_type: listing?.kind || "",
          condition_status: spec("物況"),
          parking_info: listing?.parking ? "有" : "無",
          layout_detail: listing?.layout || "",
          management_fee: spec("管理"),
          security: spec("警衛"),
          courtyard: spec("中庭"),
          main_material: spec("建材"),
          direction: spec("朝向"),
          exterior_material: spec("外牆"),
          floor_material: spec("地板"),
          main_area: spec("主建"),
          attached_area: spec("附屬"),
          common_area: spec("公設"),
          public_ratio: spec("公比"),
          building_use: spec("用途"),
          total_area: listing?.size ? listing.size + " 坪" : "",
          building_doorplate: listing?.address || "",
          commission_total: listing?.price || "",
          trade_type: listing?.deal === "rent" ? "租賃" : "買賣",
          monthly_rent: listing?.deal === "rent" ? listing.price || "" : "",
          registered_area: listing?.size || "",
          house_area: listing?.size || "",
          layout_detail: listing?.layout || "",
          property_type: listing?.kind || "",
          sales_floor: listing?.floor || "",
          direction: spec("朝向"),
          market: spec("市場"),
          school_zone: spec("學區1"),
          map_date: today(),
          latitude: listing?.lat || "",
          longitude: listing?.lng || "",
          map_radius: "週邊半徑300公尺",
          attach_title_check: true,
          attach_condition_check: true,
          attach_land_transcript: true,
          attach_building_transcript: true,
        };
      }
      function fieldHtml(f) {
        const [k, label, type, opts] = f;
        const v = doc[k] ?? "";
        if (type === "photo") return "";
        if (type === "check")
          return `<div class="field check"><input data-key="${k}" id="${k}" type="checkbox" ${v ? "checked" : ""}><label for="${k}">${esc(label)}</label></div>`;
        if (type === "textarea")
          return `<div class="field wide"><label>${esc(label)}</label><textarea data-key="${k}">${esc(v)}</textarea></div>`;
        if (type === "select")
          return `<div class="field"><label>${esc(label)}</label><select data-key="${k}">${opts.map((o) => `<option ${String(v) === o ? "selected" : ""}>${esc(o)}</option>`).join("")}</select></div>`;
        return `<div class="field"><label>${esc(label)}</label><input data-key="${k}" type="${type === "date" ? "date" : "text"}" value="${esc(v)}"></div>`;
      }
      function photoFields(fields) {
        const photos = (listing?.photos || []).map(photoUrl);
        return `<div class="group"><h3>實景照片（照片不裁切，直接使用案件照片）</h3><div class="fields"><div class="field wide"><div class="photo-choice">${photos.map((p, i) => `<div><img src="${esc(p)}" alt="案件照片 ${i + 1}"><span>案件照片 ${i + 1}</span></div>`).join("") || "<span>此案件尚未上传照片，可先回物件管理补上。</span>"}</div></div><div class="field wide"><small>在每一个列印位置选择要使用的案件照片；同一张照片也可重复使用。</small>${fields
          .map((f) => {
            const [k, label] = f;
            return `<div class="photo-slot"><b>${label}</b><select data-key="${k}"><option value="">（不列印照片）</option>${photos.map((p, i) => `<option value="${esc(p)}" ${doc[k] === p ? "selected" : ""}>案件照片 ${i + 1}</option>`).join("")}</select></div>`;
          })
          .join("")}</div></div></div>`;
      }
      function render() {
        const s = DW_DISCLOSURE_SECTIONS.find((x) => x.id === section);
        document.getElementById("sectionTitle").textContent = s.title;
        document
          .querySelectorAll("#nav button")
          .forEach((b) =>
            b.classList.toggle("on", b.dataset.section === section),
          );
        let html = "";
        if (s.groups) {
          s.groups.forEach((g) => {
            const normal = g.fields.filter((f) => f[2] !== "photo");
            const photos = g.fields.filter((f) => f[2] === "photo");
            if (normal.length)
              html += `<section class="group"><h3>${esc(g.title)}</h3><div class="fields">${normal.map(fieldHtml).join("")}</div></section>`;
            if (photos.length) html += photoFields(photos);
          });
        } else
          html = `<section class="group"><h3>${esc(s.title)}</h3><div class="fields">${s.fields.map(fieldHtml).join("")}</div></section>`;
        document.getElementById("editor").innerHTML = html;
        document.getElementById("printActions").innerHTML = pageButtons();
      }
      function pageButtons() {
        const labels = {
          cover: "封面",
          attachments: "附件簽收",
          rights: "產權調查",
          condition: "現況調查",
          exterior: "建築外觀",
          terms: "交易條件",
          summary: "建物調查表",
          map: "週邊地圖",
        };
        return (
          '<span class="print-label">單頁列印（儲存後直接開啟該頁）</span>' +
          DW_DISCLOSURE_PAGE_ORDER.map(
            (p, i) =>
              `<button type="button" class="btn" onclick="printPage('${p}')">${String(i + 1).padStart(2, "0")} ${labels[p]}</button>`,
          ).join("")
        );
      }
      function collect() {
        document
          .querySelectorAll("[data-key]")
          .forEach(
            (el) =>
              (doc[el.dataset.key] =
                el.type === "checkbox" ? el.checked : el.value),
          );
      }
      async function save(silent = false) {
        collect();
        document.getElementById("saveBtn").disabled = true;
        document.getElementById("saveStatus").textContent = "儲存中…";
        const payload = {
          listing_id: listing.id,
          sno: String(listing.sno),
          title: doc.case_name || listing.name || "",
          data: doc,
        };
        const { data, error } = await SB.from("dw_property_files")
          .upsert(payload, { onConflict: "listing_id" })
          .select()
          .single();
        document.getElementById("saveBtn").disabled = false;
        if (error) {
          document.getElementById("saveStatus").textContent = "儲存失敗";
          if (!silent)
            alert(
              "儲存失敗：" +
                error.message +
                "\n\n若是第一次使用，请先在 Supabase SQL Editor 執行 dw_property_files.sql。",
            );
          return false;
        }
        file = data;
        document.getElementById("saveStatus").textContent =
          "已儲存 " +
          new Date().toLocaleTimeString("zh-TW", {
            hour: "2-digit",
            minute: "2-digit",
          });
        return true;
      }
      async function printPage(p) {
        if (await save(true))
          window.open(
            "disclosure-print.html?sno=" +
              encodeURIComponent(SNO) +
              "&page=" +
              p +
              "&v=3",
            "_blank",
          );
      }
      async function boot() {
        if (!SNO || !SB) {
          document.getElementById("loading").textContent =
            "缺少案件编号或资料库连线设定。";
          return;
        }
        let r = await SB.from("dw_listings")
          .select("*")
          .eq("sno", SNO)
          .maybeSingle();
        if (r.error || !r.data) {
          document.getElementById("loading").textContent =
            "找不到案件：" + esc(r.error?.message || SNO);
          return;
        }
        listing = r.data;
        let d = await SB.from("dw_property_files")
          .select("*")
          .eq("listing_id", listing.id)
          .maybeSingle();
        if (d.error && d.error.code !== "PGRST116") {
          document.getElementById("loading").textContent =
            "无法读取说明书资料：" +
            esc(d.error.message) +
            "。请先执行 dw_property_files.sql。";
          return;
        }
        file = d.data;
        doc = { ...defaults(), ...(file?.data || {}) };
        // 物件後台的座標是唯一來源。每次開啟說明書都同步帶入，
        // 單張列印或整套列印在儲存後會更新既有的說明書資料。
        if (listing.lat && listing.lng) {
          doc.latitude = listing.lat;
          doc.longitude = listing.lng;
        }
        document.getElementById("caseName").textContent = listing.name;
        document.getElementById("caseMeta").textContent =
          `編號 ${listing.sno}・${listing.deal === "rent" ? "出租" : "出售"}・${listing.address || "未填地址"}`;
        document
          .getElementById("nav")
          .insertAdjacentHTML(
            "beforeend",
            DW_DISCLOSURE_SECTIONS.map(
              (s) => `<button data-section="${s.id}">${s.title}</button>`,
            ).join(""),
          );
        document.getElementById("nav").addEventListener("click", (e) => {
          const b = e.target.closest("button[data-section]");
          if (!b) return;
          collect();
          section = b.dataset.section;
          render();
        });
        document.getElementById("saveBtn").onclick = () => save();
        document.getElementById("allPrint").onclick = async () => {
          if (await save(true))
            window.open(
              "disclosure-print.html?sno=" + encodeURIComponent(SNO) + "&v=3",
              "_blank",
            );
        };
        document.getElementById("loading").style.display = "none";
        document.getElementById("app").style.display = "block";
        render();
      }
      boot();
    </script>
  </body>
</html>

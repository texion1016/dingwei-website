<html lang="zh-Hant-TW">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鼎瑋物件管理後台</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/rental-settlements.css?v=4">
<style>
:root {
  --paper: #F3EDE5; --card: #fff; --ink: #241A20; --ink-soft: #6E6067;
  --plum: #BE2418; --plum-deep: #8C1710; --plum-tint: #FBEBE9;
  --gold: #A9803D; --sell: #B33A2B; --rent: #1D5A74; --hairline: #E6DFDB;
  --ok: #2E7D4F; --warn: #A05A00;
  --radius: 10px; --shadow: 0 1px 2px rgba(36,26,32,.06), 0 8px 24px rgba(36,26,32,.07);
}
* { box-sizing: border-box; }
body { margin:0; background:var(--paper); color:var(--ink); font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif; font-size:15px; line-height:1.7; }
button { font:inherit; cursor:pointer; }
img { display:block; }
:focus-visible { outline:3px solid var(--gold); outline-offset:2px; }

.topbar { position:sticky; top:0; z-index:30; background:var(--plum); color:#fff; display:flex; align-items:center; gap:14px; padding:12px 22px; }
.topbar .seal { width:34px; height:34px; display:grid; place-items:center; background:#fff; color:var(--plum); font-family:"Noto Serif TC",serif; font-weight:900; font-size:17px; border-radius:7px; }
.topbar h1 { font-family:"Noto Serif TC",serif; font-weight:900; font-size:19px; margin:0; letter-spacing:.06em; }
.topbar .hint { font-size:12.5px; opacity:.75; }
.topbar a { color:#fff; margin-left:auto; font-size:14px; }

.wrap { max-width:1120px; margin:0 auto; padding:26px 22px 80px; }

/* 登入 */
.login-mask { position:fixed; inset:0; background:var(--paper); z-index:50; display:grid; place-items:center; }
.login-box { background:var(--card); border:1px solid var(--hairline); border-top:5px solid var(--plum); border-radius:var(--radius); box-shadow:var(--shadow); padding:36px 40px; width:min(92vw,360px); text-align:center; }
.login-box h2 { font-family:"Noto Serif TC",serif; font-weight:900; font-size:23px; margin:0 0 6px; letter-spacing:.08em; }
.login-box p { color:var(--ink-soft); font-size:13.5px; margin:0 0 20px; }
.login-box input { width:100%; font:inherit; padding:11px 14px; border:1px solid var(--hairline); border-radius:8px; text-align:center; letter-spacing:.2em; }
.login-box .err { color:var(--sell); font-size:13.5px; display:none; margin:10px 0 0; }

.btn { display:inline-flex; align-items:center; gap:6px; border:1.5px solid transparent; border-radius:999px; font-weight:700; padding:9px 20px; text-decoration:none; }
.btn-primary { background:var(--plum); color:#fff; }
.btn-primary:hover { background:var(--plum-deep); }
.btn-ghost { border-color:var(--plum); color:var(--plum); background:none; }
.btn-ghost:hover { background:var(--plum-tint); }
.btn-sm { padding:5px 13px; font-size:13.5px; border-radius:8px; }
.btn-danger { border-color:var(--sell); color:var(--sell); background:none; }
.btn-danger:hover { background:#F9ECEA; }
.btn[disabled] { opacity:.5; cursor:default; }

/* 工具列 */
.toolbar { display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin-bottom:20px; }
.toolbar .tabs { display:inline-flex; border:1.5px solid var(--plum); border-radius:999px; overflow:hidden; }
.toolbar .tabs button { border:0; background:none; padding:7px 18px; font-weight:700; color:var(--plum); }
.toolbar .tabs button.on { background:var(--plum); color:#fff; }
.toolbar .count { color:var(--ink-soft); font-size:13.5px; }
.toolbar .spacer { flex:1; }
.toolbar .search-input { min-width:260px; padding:8px 12px; border:1px solid var(--hairline); border-radius:8px; background:#fff; color:var(--ink); font:inherit; }
.toolbar .search-input:focus { outline:3px solid #f2c3bd; border-color:var(--plum); }

/* 物件列 */
.rows { display:flex; flex-direction:column; gap:12px; }
.row { display:grid; grid-template-columns:96px 1fr auto; gap:16px; align-items:center; background:var(--card); border:1px solid var(--hairline); border-radius:var(--radius); padding:12px 16px; }
.row.unlisted { opacity:.62; background:#F5F2EF; }
.row .thumb { width:96px; height:72px; border-radius:7px; object-fit:cover; background:var(--plum-tint); }
.row .nophoto { width:96px; height:72px; border-radius:7px; background:var(--plum-tint); display:grid; place-items:center; color:var(--plum); font-size:12px; }
.row .t { display:flex; align-items:center; flex-wrap:wrap; gap:8px; font-weight:700; font-size:17px; }
.row .t .seal-mini { width:24px; height:24px; display:grid; place-items:center; border-radius:5px; color:#fff; font-family:"Noto Serif TC",serif; font-weight:900; font-size:13px; }
.seal-sell { background:var(--sell); } .seal-rent { background:var(--rent); }
.row .sub { color:var(--ink-soft); font-size:13.5px; }
.row .price { font-family:"Noto Serif TC",serif; font-weight:900; font-size:19px; }
.row .price.s { color:var(--sell); } .row .price.r { color:var(--rent); }
.badge { font-size:12px; font-weight:700; border-radius:6px; padding:2px 9px; }
.badge.on { background:#E7F2EB; color:var(--ok); }
.badge.off { background:#F3E9DC; color:var(--warn); }
.row .acts { display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; }

.empty { text-align:center; color:var(--ink-soft); background:var(--card); border:1px dashed var(--hairline); border-radius:var(--radius); padding:60px 20px; }
.notice { background:#FDF6EC; border:1px solid #EAD9BC; color:#7A5A22; border-radius:var(--radius); padding:14px 18px; font-size:14px; margin-bottom:18px; display:none; }

/* 表單彈窗 */
.modal-mask { position:fixed; inset:0; background:rgba(36,26,32,.5); z-index:40; display:none; align-items:flex-start; justify-content:center; overflow-y:auto; padding:30px 14px; }
.modal-mask.open { display:flex; }
.modal { background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); width:min(100%,720px); padding:28px 30px 26px; }
.modal h2 { font-family:"Noto Serif TC",serif; font-weight:900; font-size:23px; margin:0 0 18px; letter-spacing:.06em; }
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:12px 16px; }
.grid3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px 16px; }
.field { display:flex; flex-direction:column; gap:4px; }
.field.full { grid-column:1 / -1; }
.field label { font-size:13px; font-weight:700; color:var(--ink-soft); }
.field label .req { color:var(--sell); }
.field input, .field select, .field textarea { font:inherit; padding:9px 12px; border:1px solid var(--hairline); border-radius:8px; background:#fff; color:var(--ink); }
.field textarea { resize:vertical; }
.field .tip { font-size:12px; color:var(--ink-soft); }
.spec-editor { border:1px solid var(--hairline); border-radius:8px; overflow:hidden; background:#fffdfc; }
.spec-section + .spec-section { border-top:1px solid var(--hairline); }
.spec-section-title { margin:0; padding:8px 12px; background:var(--plum-tint); color:var(--plum-deep); font-size:13px; font-weight:700; }
.spec-inputs { display:grid; grid-template-columns:1fr 1fr; }
.spec-entry { display:grid; grid-template-columns:106px minmax(0,1fr); min-height:42px; border-top:1px solid var(--hairline); }
.spec-entry:nth-child(odd) { border-right:1px solid var(--hairline); }
.spec-entry label { display:flex; align-items:center; padding:7px 10px; color:var(--ink-soft); font-size:13px; font-weight:700; background:#FCFAF8; }
.spec-entry input { min-width:0; border:0; border-radius:0; padding:7px 10px; background:#fff; }
.spec-entry input:focus { outline:2px solid #f2c3bd; outline-offset:-2px; }
.custom-spec { margin-top:12px; border:1px dashed #d7c8c2; border-radius:8px; padding:10px; background:#fff; }
.custom-spec-head { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:8px; color:var(--ink-soft); font-size:13px; font-weight:700; }
.custom-spec-head .btn { padding:5px 11px; border-radius:7px; font-size:12.5px; }
.custom-spec-rows { display:flex; flex-direction:column; gap:7px; }
.custom-spec-row { display:grid; grid-template-columns:minmax(118px,.42fr) minmax(0,1fr) 32px; gap:7px; align-items:center; }
.custom-spec-row input { min-width:0; padding:7px 9px; }
.custom-spec-row button { width:32px; height:32px; border:1px solid #e4c0bb; border-radius:7px; color:var(--sell); background:#fff7f6; font-weight:700; }
.geo-row { display:grid; grid-template-columns:1fr auto; gap:8px; align-items:center; }
.geo-row .btn { justify-content:center; white-space:nowrap; border-radius:8px; padding:9px 14px; }
.geo-status { min-height:18px; color:var(--ink-soft); font-size:12px; }
.geo-status.ok { color:var(--ok); }
.geo-status.err { color:var(--sell); }
.deal-radio { display:flex; gap:10px; }
.deal-radio label { flex:1; display:grid; place-items:center; border:1.5px solid var(--hairline); border-radius:8px; padding:9px; font-weight:700; cursor:pointer; }
.deal-radio input { display:none; }
.deal-radio label.sel-s { border-color:var(--sell); color:var(--sell); background:#FBF0EE; }
.deal-radio label.sel-r { border-color:var(--rent); color:var(--rent); background:#EDF4F8; }
.photo-list { display:flex; flex-wrap:wrap; gap:10px; margin-top:6px; }
.photo-chip { position:relative; width:104px; }
.photo-chip img { width:104px; height:78px; object-fit:cover; border-radius:7px; border:1px solid var(--hairline); }
.video-chip video { width:104px; height:78px; object-fit:cover; border-radius:7px; border:1px solid var(--hairline); background:#231b19; }
.video-chip span { display:block; font-size:12px; color:var(--ink-soft); margin-top:3px; }
.photo-chip .rm { position:absolute; top:-8px; right:-8px; width:24px; height:24px; border-radius:50%; border:0; background:var(--sell); color:#fff; font-weight:700; line-height:1; }
.photo-chip .mv { position:absolute; bottom:4px; left:4px; width:24px; height:22px; border-radius:5px; border:0; background:rgba(0,0,0,.55); color:#fff; font-size:12px; }
.modal .foot { display:flex; gap:12px; justify-content:flex-end; margin-top:22px; padding-top:16px; border-top:1px solid var(--hairline); }
.modal .foot .status { margin-right:auto; color:var(--ink-soft); font-size:13.5px; align-self:center; }

@media (max-width:720px) {
  .row { grid-template-columns:72px 1fr; }
  .row .thumb, .row .nophoto { width:72px; height:56px; }
  .row .acts { grid-column:1 / -1; justify-content:flex-start; }
  .grid2, .grid3 { grid-template-columns:1fr; }
  .spec-inputs { grid-template-columns:1fr; }
  .spec-entry:nth-child(odd) { border-right:0; }
  .geo-row { grid-template-columns:1fr; }
  .toolbar .search-input { width:100%; min-width:0; }
}
</style>
</head>
<body>

<header class="topbar">
  <span class="seal">鼎</span>
  <h1>物件管理後台</h1>
  <span class="hint">刊登、下架即時同步官網</span>
  <a href="index.html">開啟官網 ↗</a>
</header>

<div class="wrap">
  <div class="notice" id="dbNotice"></div>

  <div class="toolbar" style="margin-bottom:8px">
    <div class="tabs" id="pageTabs">
      <button data-p="listings" class="on">物件管理</button>
      <button data-p="settlements">代租代管結算</button>
      <button data-p="messages">需求留言 <span id="msgBadge"></span></button>
    </div>
  </div>

  <div id="panelListings">
  <div class="toolbar">
    <div class="tabs" id="tabs">
      <button data-f="all" class="on">全部</button>
      <button data-f="sell">出售</button>
      <button data-f="rent">出租</button>
      <button data-f="unlisted">已下架</button>
    </div>
    <input class="search-input" id="listingSearch" type="search" placeholder="案名、編號" aria-label="查詢物件">
    <span class="count" id="count"></span>
    <span class="spacer"></span>
    <button class="btn btn-ghost" id="importBtn" style="display:none" onclick="importOld()">匯入舊站 37 筆物件</button>
    <button class="btn btn-primary" onclick="openForm(null)">＋ 刊登新物件</button>
  </div>

  <div class="rows" id="rows"></div>
  </div>

  <div id="panelSettlements" style="display:none"></div>

  <div id="panelMessages" style="display:none">
    <div class="toolbar">
      <div class="tabs" id="msgTabs">
        <button data-m="open" class="on">待處理</button>
        <button data-m="done">已處理</button>
        <button data-m="all">全部</button>
      </div>
      <span class="count" id="msgCount"></span>
    </div>
    <div class="rows" id="msgRows"></div>
  </div>
</div>

<!-- 新增 / 編輯表單 -->
<div class="modal-mask" id="modalMask">
  <div class="modal">
    <h2 id="formTitle">刊登新物件</h2>
    <div class="grid2">
      <div class="field">
        <label>刊登類型 <span class="req">＊</span></label>
        <div class="deal-radio" id="dealRadio">
          <label id="dealS" class="sel-s"><input type="radio" name="deal" value="sell" checked>售</label>
          <label id="dealR"><input type="radio" name="deal" value="rent">租</label>
        </div>
      </div>
      <div class="field">
        <label>案名 <span class="req">＊</span></label>
        <input id="f_name" placeholder="例：合雄悅園">
      </div>
      <div class="field">
        <label>案件編號 <span class="req">＊</span></label>
        <input id="f_sno" maxlength="48" placeholder="例：136834">
      </div>
      <div class="field">
        <label>區域</label>
        <input id="f_district" list="districtList" placeholder="例：蘆竹">
        <datalist id="districtList">
          <option>蘆竹</option><option>桃園</option><option>龜山</option><option>大園</option>
          <option>中壢</option><option>八德</option><option>大溪</option><option>平鎮</option>
          <option>楊梅</option><option>新屋</option><option>觀音</option><option>龍潭</option>
        </datalist>
      </div>
      <div class="field">
        <label>種類</label>
        <input id="f_kind" list="kindList" placeholder="例：住宅大樓">
        <datalist id="kindList">
          <option>住宅大樓</option><option>電梯華廈</option><option>透天厝</option><option>別墅</option>
          <option>公寓</option><option>套房</option><option>店面</option><option>土地</option>
          <option>廠房</option><option>辦公</option><option>車位</option>
        </datalist>
      </div>
      <div class="field">
        <label id="priceLabel">總價（萬） <span class="req">＊</span></label>
        <input id="f_price" type="number" step="0.01" min="0" placeholder="例：1280">
      </div>
      <div class="field">
        <label>坪數</label>
        <input id="f_size" type="number" step="0.01" min="0" placeholder="例：45.6">
      </div>
      <div class="field">
        <label>格局</label>
        <input id="f_layout" placeholder="例：3房2廳2衛">
      </div>
      <div class="field">
        <label>本戶樓層</label>
        <input id="f_floor_unit" placeholder="例：5">
      </div>
      <div class="field">
        <label>總樓高</label>
        <input id="f_floor_total" placeholder="例：15">
      </div>
      <div class="field">
        <label>屋齡</label>
        <input id="f_age" placeholder="例：12年">
      </div>
      <div class="field">
        <label>含車位</label>
        <select id="f_parking"><option value="false">否</option><option value="true">是</option></select>
      </div>
      <div class="field full">
        <label>案址</label>
        <input id="f_address" placeholder="例：桃園市蘆竹區南昌路">
      </div>
      <div class="field full">
        <label>Google 地圖網址或完整地址</label>
        <div class="geo-row">
          <input id="f_geo_query" placeholder="貼上 Google Maps 分享連結，或輸入完整地址">
          <button type="button" class="btn btn-ghost" onclick="locateAddress(this)">取得經緯度</button>
        </div>
        <span id="geoStatus" class="geo-status">可貼上 Google 地圖分享連結；直接查地址時會定位到路段中心。</span>
      </div>
      <div class="field">
        <label>緯度</label>
        <input id="f_lat" inputmode="decimal" placeholder="自動帶入，可手動修正">
      </div>
      <div class="field">
        <label>經度</label>
        <input id="f_lng" inputmode="decimal" placeholder="自動帶入，可手動修正">
      </div>
      <div class="field full">
        <label>訴求重點（一行一句，顯示在物件頁特色卡）</label>
        <textarea id="f_pitch" rows="4" placeholder="例：&#10;近南崁市區生活機能佳&#10;邊間採光通風好&#10;全天保全管理嚴謹"></textarea>
      </div>
      <div class="field full">
        <label>建物與環境規格（選填）</label>
        <div class="spec-editor" id="specPresetFields"></div>
        <div class="custom-spec">
          <div class="custom-spec-head"><span>其他規格</span><button type="button" class="btn btn-ghost" onclick="addCustomSpec()">＋ 新增項目</button></div>
          <div class="custom-spec-rows" id="customSpecRows"></div>
        </div>
        <span class="tip">固定項目與其他規格都只會在填入內容後顯示於前台；其他規格可自行新增任何建物專屬項目。</span>
      </div>
      <div class="field full">
        <label>照片（第一張為封面，可拖入多張）</label>
        <input type="file" id="f_photos" accept="image/*" multiple>
        <div class="photo-list" id="photoList"></div>
      </div>
      <div class="field full">
        <label>影片（選填，可上傳 MP4／MOV／WebM；建議單支 100MB 內）</label>
        <input type="file" id="f_videos" accept="video/mp4,video/quicktime,video/webm" multiple>
        <div class="photo-list video-list" id="videoList"></div>
        <span class="tip">影片會顯示在物件詳情頁的「物件影片」區塊；第一支會優先顯示。</span>
      </div>
    </div>
    <div class="foot">
      <span class="status" id="formStatus"></span>
      <button class="btn btn-ghost" onclick="closeForm()">取消</button>
      <button class="btn btn-primary" id="saveBtn" onclick="saveForm()">儲存並刊登</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/config.js?v=6"></script>
<script src="assets/data.js?v=8"></script>
<script>
const _SB_CFG = window.DW_SB || { url: '', key: '' };
const _sb = _SB_CFG.url ? supabase.createClient(location.origin + '/api/admin/supabase', 'dw-admin-session', {
  auth: { persistSession: false, autoRefreshToken: false }
}) : null;

let ALL = [];          // 資料庫全部物件
let FILTER = 'all';
let SEARCH = '';
let editingRow = null; // null = 新增
let formPhotos = [];   // 表單目前的照片（檔名或網址）
let formVideos = [];   // 表單目前的影片網址
const SPEC_SECTIONS = [
  { title: '坪數與建物', fields: [
    ['建坪', '建物登記'], ['地坪', '土地坪數'], ['主建', '主建物'], ['附屬', '附屬建物'], ['公設', '公設'], ['公比', '公設比'],
    ['建材', '建築結構'], ['外牆', '外牆建材'], ['地板', '室內地板'], ['用途', '登記用途'], ['地下', '地下樓層']
  ] },
  { title: '管理與環境', fields: [
    ['警衛', '管理員'], ['中庭', '中庭花園'], ['管理', '管理費'], ['學區1', '學區'], ['公園', '公園'],
    ['學區2', '學區（二）'], ['市場', '市場'], ['捷運', '捷運'], ['站名', '站名']
  ] }
];
const SPEC_PRESET_KEYS = new Set(SPEC_SECTIONS.flatMap(section => section.fields.map(field => field[0])));

/* ---------- 工具 ---------- */
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function photoUrl(p) { return /^https?:\/\//.test(p) ? p : 'assets/photos/' + p; }
function customSpecRow(key = '', value = '') {
  return '<div class="custom-spec-row"><input data-custom-key placeholder="項目名稱" value="' + esc(key) + '"><input data-custom-value placeholder="項目內容" value="' + esc(value) + '"><button type="button" title="移除此項目" onclick="this.closest(\'.custom-spec-row\').remove()">✕</button></div>';
}
function addCustomSpec(key = '', value = '') {
  F('customSpecRows').insertAdjacentHTML('beforeend', customSpecRow(key, value));
}
function renderSpecEditor(spec = {}) {

function publicStorageUrl(path) {

}
function coordinate(value, min, max) {
  const n = Number(String(value || '').trim());

}
async function locateAddress(button) {
  const query = F('f_geo_query').value.trim() || F('f_address').value.trim();
  if (!query) { setGeoStatus('請先貼上 Google 地圖連結或填入完整地址。', 'err'); return; }
  setGeoStatus('正在取得位置…');
  if (button) button.disabled = true;
  try {
    const response = await fetch('/api/admin/geocode?query=' + encodeURIComponent(query), { credentials: 'same-origin' });
    const result = await response.json().catch(() => ({}));
    if (!response.ok || !result.lat || !result.lng) throw new Error(result.error || '找不到可用的座標');
    F('f_lat').value = Number(result.lat).toFixed(6);
    F('f_lng').value = Number(result.lng).toFixed(6);
    setGeoStatus('已帶入座標：' + F('f_lat').value + '，' + F('f_lng').value + (result.display_name ? '（' + result.display_name + '）' : ''), 'ok');
  } catch (err) {
    setGeoStatus('無法取得座標：' + (err.message || '請確認連結或地址'), 'err');
  } finally {
    if (button) button.disabled = false;
  }
}

async function toggleStatus(id) {
  const r = ALL.find(x => x.id === id); if (!r) return;
  const next = r.status === 'active' ? 'unlisted' : 'active';
  const { error } = await _sb.from('dw_listings')
    .update({ status: next, updated_at: new Date().toISOString() }).eq('id', id);
  if (error) { alert('更新失敗：' + error.message); return; }
  r.status = next;
  render();
}

async function delRow(id) {
  const r = ALL.find(x => x.id === id); if (!r) return;
  if (!confirm('確定要永久刪除「' + r.name + '」？\n（若只是成交或暫停刊登，建議用「下架」即可）')) return;
  if (!confirm('再次確認：這會永久刪除「' + r.name + '」及其售租屋資料，無法復原。\n\n確定要刪除嗎？')) return;
  const { error } = await _sb.from('dw_listings').delete().eq('id', id);
  if (error) { alert('刪除失敗：' + error.message); return; }
  ALL = ALL.filter(x => x.id !== id);
  render();
}

function cleanFloorUnit(value) {
  return String(value || '').trim().replace(/[樓楼]\s*$/u, '').trim();
}
function cleanFloorTotal(value) {
  return String(value || '').trim()
    .replace(/[（(]?\s*[總总]樓(?:高|層)\s*[）)]?/gu, '')
    .replace(/[樓楼]\s*$/u, '').trim();
}
function splitFloor(value) {
  const raw = String(value || '').trim();
  if (!raw) return { unit: '', total: '' };
  const parts = raw.split(/\s*[／/]\s*/u);
  if (parts.length >= 2) return { unit: cleanFloorUnit(parts[0]), total: cleanFloorTotal(parts[1]) };
  if (/[總总]樓(?:高|層)/u.test(raw)) return { unit: '', total: cleanFloorTotal(raw) };
  return { unit: cleanFloorUnit(raw), total: '' };
}
function formatFloor(unit, total) {
  const current = cleanFloorUnit(unit);
  const building = cleanFloorTotal(total);
  if (current && building) return current + '樓 / ' + building + '總樓層';
  if (current) return current + '樓';
  if (building) return building + '總樓層';
  return '';
}

  return {applyListingToDocument, syncAliases};

  if (!_sb) { alert('尚未設定資料庫連線（assets/config.js）'); e.target.value = ''; return; }
  const tooLarge = files.find(file => file.size > 100 * 1024 * 1024);
  if (tooLarge && !confirm('「' + tooLarge.name + '」超過 100MB，上傳可能較久且會佔用雲端空間。仍要上傳嗎？')) { e.target.value = ''; return; }
  F('formStatus').textContent = '影片上傳中…';
  F('saveBtn').disabled = true;
  for (const file of files) {
    const ext = (file.name.split('.').pop() || 'mp4').toLowerCase();
    const path = 'listing/video_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7) + '.' + ext;
    const { error } = await _sb.storage.from('dw-photos').upload(path, file, { contentType: file.type, upsert: false });
    if (error) { alert('影片上傳失敗：' + error.message); break; }
    formVideos.push(publicStorageUrl(path));
  }
  renderVideoChips();
  F('formStatus').textContent = '';
  F('saveBtn').disabled = false;
  e.target.value = '';
});

async function saveForm() {
  if (!_sb) { alert('尚未設定資料庫連線（assets/config.js）'); return; }
  const name = F('f_name').value.trim();
  const sno = F('f_sno').value.trim();
  const price = parseFloat(F('f_price').value);
  if (!name) { alert('請填寫案名'); return; }
  if (!sno) { alert('請填寫案件編號'); return; }
  if (ALL.some(item => String(item.sno) === sno && item.id !== editingRow?.id)) { alert('這個案件編號已存在，請換一個編號。'); return; }
  if (!(price > 0)) { alert('請填寫價格'); return; }

  const spec = {};
  document.querySelectorAll('[data-spec-key]').forEach(input => {
    const value = input.value.trim();
    if (value) spec[input.dataset.specKey] = value;
  });
  document.querySelectorAll('.custom-spec-row').forEach(item => {
    const key = item.querySelector('[data-custom-key]').value.trim();
    const value = item.querySelector('[data-custom-value]').value.trim();
    if (key && value && !spec[key]) spec[key] = value;
  });
  const latitude = coordinate(F('f_lat').value, -90, 90);
  const longitude = coordinate(F('f_lng').value, -180, 180);
  if ((F('f_lat').value.trim() && latitude === null) || (F('f_lng').value.trim() && longitude === null)) { alert('緯度或經度格式不正確。'); return; }
  if ((latitude === null) !== (longitude === null)) { alert('緯度與經度請一併填寫。'); return; }

  const row = {
    sno,
    deal: document.querySelector('#dealRadio input:checked').value,
    name,
    district: F('f_district').value.trim(),
    kind: F('f_kind').value.trim(),
    price,
    size: parseFloat(F('f_size').value) || 0,
    parking: F('f_parking').value === 'true',
    address: F('f_address').value.trim(),
    lat: latitude === null ? '' : latitude,
    lng: longitude === null ? '' : longitude,
    layout: F('f_layout').value.trim(),
    floor: formatFloor(F('f_floor_unit').value, F('f_floor_total').value),
    age: F('f_age').value.trim(),
    pitch: F('f_pitch').value.split('\n').map(s => s.trim()).filter(Boolean),
    spec,
    photos: formPhotos,
    videos: formVideos,
    updated_at: new Date().toISOString()
  };
  if (row.deal === 'sell' && row.size > 0) row.unit = (price / row.size).toFixed(1);

  F('saveBtn').disabled = true;
  F('formStatus').textContent = '儲存中…';
  let error, savedRow;
  if (editingRow) {
    ({ data: savedRow, error } = await _sb.from('dw_listings').update(row).eq('id', editingRow.id).select().single());
  } else {
    row.status = 'active';
    ({ data: savedRow, error } = await _sb.from('dw_listings').insert(row).select().single());
  }
  F('saveBtn').disabled = false;
  if (error) { F('formStatus').textContent = ''; alert('儲存失敗：' + error.message); return; }
  const syncError = await syncListingDocument(savedRow);
  if (syncError) {
    F('formStatus').textContent = '';
    alert('案件已儲存，但售租屋資料同步失敗：' + syncError.message + '。請重新儲存一次。');
    return;
  }
  closeForm();
  loadAll();
}

document.addEventListener('DOMContentLoaded', () => { loadAll(); loadMsgs(); });
</script>
